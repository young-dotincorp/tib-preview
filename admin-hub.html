<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tactile World · 관리자 허브</title>
<style>
  :root{
    --ink:#1F1D1A; --ink-soft:#5C574E; --ink-faint:#9A9384;
    --accent:#FF4F00; --line:#ECE6DC; --bg:#FAF8F3; --card:#fff;
    --ok:#0F6E56; --ok-bg:#E1F5EE; --warn-bg:#FAEEDA; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;line-height:1.6;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:820px;margin:0 auto;padding:36px 18px 90px;}

  /* 헤더 — 촉각 점(핀) 모티프 */
  .head{display:flex;align-items:center;gap:14px;margin-bottom:4px;}
  .dots{display:grid;grid-template-columns:repeat(2,7px);gap:5px;flex:0 0 auto;padding:8px;background:#16150F;border-radius:10px;}
  .dots i{width:7px;height:7px;border-radius:50%;background:#4A463E;display:block;}
  .dots i.on{background:var(--accent);}
  h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em;}
  .sub{color:var(--ink-soft);font-size:14px;margin:2px 0 26px;}

  .who{font-size:12.5px;color:var(--ink-faint);margin-bottom:18px;}
  .who b{color:var(--ink-soft);font-weight:700;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:600px){ .grid{grid-template-columns:1fr;} }

  .tool{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 16px;text-decoration:none;color:inherit;transition:border-color .15s, transform .15s;position:relative;}
  a.tool:hover{border-color:var(--accent);transform:translateY(-2px);}
  .tool .t{font-size:16px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  .tool .d{font-size:13px;color:var(--ink-soft);margin:0;flex:1;}
  .tool .go{margin-top:14px;font-size:13px;font-weight:700;color:var(--accent);}
  .tool.soon{opacity:.72;}
  .tool.soon .go{color:var(--ink-faint);}
  .badge{position:absolute;top:14px;right:14px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--warn-bg);color:#854F0B;}
  .badge.zero{background:var(--ok-bg);color:var(--ok);}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#F0ECE3;color:var(--ink-faint);}

  .msg{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:30px 22px;text-align:center;color:var(--ink-soft);}
  .msg b{color:var(--ink);display:block;font-size:16px;margin-bottom:6px;}
  .msg a{color:var(--accent);font-weight:700;text-decoration:none;}
  .foot{margin-top:28px;font-size:12px;color:var(--ink-faint);text-align:center;line-height:1.8;}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid #D9D5CC;background:#fff;color:var(--ink);padding:7px 13px;font-size:13px;}
  button:hover{background:#F4F1EA}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="dots" aria-hidden="true">
      <i class="on"></i><i></i><i class="on"></i><i class="on"></i><i></i><i class="on"></i><i class="on"></i><i></i>
    </div>
    <div>
      <h1>관리자 허브</h1>
    </div>
  </div>
  <p class="sub">Tactile World 운영 도구를 한곳에서 관리해요.</p>

  <div id="root" aria-live="polite">
    <div class="msg">불러오는 중…</div>
  </div>

  <div class="foot">
    관리자 전용 공간입니다. 메인 사이트에 관리자 계정으로 로그인되어 있어야 도구가 열립니다.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  var SB = window.__TIB_SB__ || {
    url: "https://nqgaqzpbhmezkrrlbbhm.supabase.co",
    key: "sb_publishable_IThvI0wJJex8U4UiATHFyw_B_2jIphy"
  };
  var root = document.getElementById("root");
  function msg(html){ root.innerHTML='<div class="msg">'+html+'</div>'; }

  if(!(window.supabase && window.supabase.createClient)){
    msg("<b>연결 라이브러리를 불러오지 못했어요.</b>네트워크 확인 후 새로고침해 주세요."); return;
  }
  var sb = window.supabase.createClient(SB.url, SB.key,
    { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } });

  // 도구 목록 (준비되면 soon:false 로 바꾸고 href 연결)
  var TOOLS = [
    { key:"review", t:"검수 대기열", d:"제출된 촉각 그래픽을 기준에 맞춰 검수하고 공개해요. 닷패드로 출력해 손끝으로 확인할 수 있어요.", href:"admin-review.html", ready:true, count:"pending" },
    { key:"inbox",  t:"메시지함", d:"이용자 문의와 신고를 확인하고 답변해요.", ready:false },
    { key:"dash",   t:"대시보드", d:"업로드·창작자·검수 현황을 한눈에 봐요.", ready:false }
  ];

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  function renderTools(){
    var html='<div class="grid">';
    TOOLS.forEach(function(x){
      var tag = x.ready ? "" : '<span class="tag">준비 중</span>';
      var badge = (x.ready && x.count==="pending") ? '<span class="badge" id="cnt-'+x.key+'">…</span>' : "";
      var inner =
        '<p class="t">'+esc(x.t)+' '+tag+'</p>'+
        '<p class="d">'+esc(x.d)+'</p>'+
        '<span class="go">'+(x.ready?"열기 →":"곧 제공돼요")+'</span>'+badge;
      if(x.ready){ html += '<a class="tool" href="'+x.href+'">'+inner+'</a>'; }
      else { html += '<div class="tool soon">'+inner+'</div>'; }
    });
    html+='</div>';
    root.innerHTML=html;
    // 검수 대기 건수 채우기 (읽기 전용)
    var cntEl=document.getElementById("cnt-review");
    if(cntEl){
      sb.from("graphics").select("id",{count:"exact",head:true}).eq("status","pending")
        .then(function(res){
          if(res.error){ cntEl.style.display="none"; return; }
          var n=res.count||0;
          cntEl.textContent = n+"건";
          if(!n) cntEl.className="badge zero";
        }).catch(function(){ cntEl.style.display="none"; });
    }
  }

  function load(){
    msg("불러오는 중…");
    sb.auth.getSession().then(function(r){
      var s=r&&r.data?r.data.session:null;
      if(!s){ msg('<b>관리자 로그인이 필요해요.</b>먼저 <a href="/#/">메인 사이트</a>에 관리자 계정으로 로그인한 뒤, 이 페이지를 새로고침해 주세요.'); return; }
      var uid=s.user&&s.user.id;
      sb.from("app_admins").select("user_id").eq("user_id",uid).maybeSingle().then(function(a){
        if(a.error||!a.data){ msg("<b>관리자 전용 페이지예요.</b>이 계정에는 운영 권한이 없어요."); return; }
        renderTools();
      });
    }).catch(function(){ msg("<b>세션 확인에 실패했어요.</b>새로고침해 주세요."); });
  }
  load();
})();
</script>
</body>
</html>
