<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tactile World · 운영 콘솔</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{
    --accent:#ff4f00; --accent-dark:#e84800; --accent-tint:#fff4ee; --accent-line:#ffd9c7;
    --cream:#faf7f2; --card:#ffffff; --line:#ece7df;
    --ink:#16150f; --ink-soft:#5f5e5a; --ink-faint:#a8a39a; --ink-mute:#b4b2a9;
    --ok:#1f9d57; --ok-tint:#eaf7ef;
    --r:14px; --r-sm:10px;
    --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;font-size:15px}
  button{font-family:inherit;cursor:pointer}
  textarea,input{font-family:inherit}
  [hidden]{display:none!important}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-dot{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
  .brand-tt{font-weight:700;font-size:15px;letter-spacing:-.01em}
  .brand-sub{font-size:12px;color:var(--ink-faint);margin-top:1px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--r-sm);font-weight:600;font-size:14.5px;padding:12px 16px;transition:background .14s,opacity .14s,border-color .14s}

  /* ---------- 로그인 ---------- */
  .login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 30px;box-shadow:0 8px 30px rgba(40,30,15,.06)}
  .login-card .brand{margin-bottom:22px}
  .login-h{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
  .login-p{font-size:13.5px;color:var(--ink-soft);margin:0 0 22px}
  .btn-google{width:100%;background:#fff;color:#16150f;border:1px solid #dcdcdc;font-weight:600}
  .btn-google:hover{background:#f7f6f4;border-color:#cfcfcf}
  .or{display:flex;align-items:center;gap:10px;margin:18px 0 16px;color:var(--ink-faint);font-size:12px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
  .field input{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;font-size:14.5px;color:var(--ink);background:#fff;transition:border-color .14s,box-shadow .14s}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
  .btn-accent{background:var(--accent);color:#fff;width:100%}
  .btn-accent:hover{background:var(--accent-dark)}
  .btn-accent:disabled{opacity:.55;cursor:default}
  .msg{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:var(--r-sm);line-height:1.45}
  .msg.err{background:#fdecea;color:#c0392b;border:1px solid #f6d2cc}
  .booting{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink-faint);font-size:13.5px}

  /* ---------- 콘솔 ---------- */
  .top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
  .top-in{max-width:780px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:12px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .who{font-size:12.5px;color:var(--ink-faint);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn-ghost{background:#fff;border:1px solid var(--line);border-radius:9px;color:var(--ink-soft);font-weight:600;font-size:12.5px;padding:8px 12px;transition:border-color .14s,color .14s}
  .btn-ghost:hover{border-color:var(--accent-line);color:var(--accent)}

  .tabsbar{background:#fff;border-bottom:1px solid var(--line)}
  .tabsbar-in{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap}
  .tab{display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;transition:all .14s}
  .tab:hover{border-color:var(--accent-line)}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab.soon{color:var(--ink-mute)}
  .tab .tcount{background:var(--accent-tint);color:var(--accent);border-radius:999px;padding:0 7px;font-size:11px;font-weight:700;min-width:18px;text-align:center}
  .tab[aria-selected="true"] .tcount{background:rgba(255,255,255,.28);color:#fff}
  .tab .soonbadge{font-size:10px;background:#f1efe8;color:var(--ink-faint);border-radius:5px;padding:1px 6px;font-weight:600}
  .tab svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

  .wrap{max-width:780px;margin:0 auto;padding:20px 20px 60px}
  .bar{display:flex;align-items:center;gap:14px;margin:4px 2px 16px;flex-wrap:wrap}
  .count{font-size:13px;color:var(--ink-soft)}
  .count b{color:var(--ink);font-weight:700}
  .count .pend{color:var(--accent)}
  .filters{display:flex;gap:6px;margin-left:auto}
  .fchip{background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--ink-soft);font-weight:600;font-size:12.5px;padding:6px 13px;transition:all .14s}
  .fchip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .refresh{background:none;border:none;color:var(--ink-faint);font-size:12.5px;font-weight:600;padding:6px 4px;display:inline-flex;align-items:center;gap:5px}
  .refresh:hover{color:var(--accent)}
  .refresh svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;margin-bottom:13px;animation:rise .26s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .cat{font-weight:700;font-size:14px;letter-spacing:-.01em}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .badge.new{background:var(--accent-tint);color:var(--accent)}
  .badge.done{background:var(--ok-tint);color:var(--ok)}
  .badge.prog{background:#fff4e0;color:#b8791a}
  .c-date{margin-left:auto;font-size:12px;color:var(--ink-faint)}
  .c-msg{background:var(--cream);border-radius:var(--r-sm);padding:12px 13px;font-size:14px;color:var(--ink);line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .c-meta{display:flex;gap:12px;flex-wrap:wrap;margin:9px 1px 0;font-size:12px;color:var(--ink-faint)}
  .c-meta .tk{font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .c-meta a{color:var(--ink-soft);text-decoration:none}
  .c-meta a:hover{color:var(--accent)}
  .prev{margin-top:12px;background:var(--accent-tint);border:1px solid var(--accent-line);border-radius:var(--r-sm);padding:10px 12px}
  .prev-l{font-size:11.5px;font-weight:700;color:var(--accent);margin-bottom:4px}
  .prev-t{font-size:13.5px;color:#3a3934;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .prev-when{font-size:11px;color:var(--ink-faint);margin-top:5px}
  .reply{margin-top:12px;border-top:1px dashed var(--line);padding-top:13px}
  .reply textarea{width:100%;min-height:74px;resize:vertical;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;font-size:14px;color:var(--ink);line-height:1.55;transition:border-color .14s,box-shadow .14s}
  .reply textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
  .reply-row{display:flex;align-items:center;gap:10px;margin-top:9px}
  .reply-note{font-size:11.5px;color:var(--ink-faint);line-height:1.4}
  .btn-send{background:var(--accent);color:#fff;border:none;border-radius:9px;font-weight:600;font-size:13px;padding:9px 15px;margin-left:auto;white-space:nowrap;transition:background .14s,opacity .14s}
  .btn-send:hover{background:var(--accent-dark)}
  .btn-send:disabled{opacity:.55;cursor:default}
  .sent{color:var(--ok);font-size:12.5px;font-weight:600;margin-left:auto}

  .empty{text-align:center;padding:60px 20px;color:var(--ink-faint)}
  .empty .em-ic{width:48px;height:48px;border-radius:14px;background:var(--accent-tint);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
  .empty .em-ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .empty h3{margin:0 0 5px;font-size:15px;font-weight:700;color:var(--ink-soft)}
  .empty p{margin:0;font-size:13.5px;max-width:300px;margin-inline:auto;line-height:1.5}
  .loading{text-align:center;padding:50px 20px;color:var(--ink-faint);font-size:13.5px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;margin-bottom:12px;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:480px){
    .login-card{padding:28px 22px}
    .wrap,.top-in,.tabsbar-in{padding-left:14px;padding-right:14px}
    .who{max-width:130px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 부팅(세션 확인 중) -->
<div id="boot-view" class="booting">
  <span class="spin" aria-hidden="true"></span>
  <span>불러오는 중…</span>
</div>

<!-- 로그인 -->
<main id="login-view" class="login-wrap" hidden>
  <div class="login-card">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="7" cy="7" r="1.4"/><circle cx="7" cy="17" r="1.4"/><circle cx="17" cy="7" r="1.4"/><circle cx="17" cy="17" r="1.4"/></svg></span>
      <span><span class="brand-tt">Tactile World</span><span class="brand-sub">관리자 콘솔</span></span>
    </div>
    <h1 class="login-h">운영 콘솔</h1>
    <p class="login-p">관리자 계정으로 로그인하면 챗봇 문의에 답하고 운영 작업을 할 수 있어요.</p>

    <button id="lg-google" class="btn btn-google" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Google 계정으로 로그인
    </button>

    <div class="or">또는 이메일로</div>
    <div class="field">
      <label for="lg-email">이메일</label>
      <input id="lg-email" type="email" autocomplete="username" placeholder="you@dotincorp.com" inputmode="email">
    </div>
    <div class="field">
      <label for="lg-pw">비밀번호</label>
      <input id="lg-pw" type="password" autocomplete="current-password" placeholder="비밀번호">
    </div>
    <button id="lg-btn" class="btn btn-accent" type="button">로그인</button>
    <div id="lg-msg" class="msg err" role="alert" hidden></div>
  </div>
</main>

<!-- 콘솔 -->
<div id="console-view" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="7" cy="7" r="1.4"/><circle cx="7" cy="17" r="1.4"/><circle cx="17" cy="7" r="1.4"/><circle cx="17" cy="17" r="1.4"/></svg></span>
        <span><span class="brand-tt">운영 콘솔</span><span class="brand-sub">Tactile World</span></span>
      </div>
      <div class="top-right">
        <span class="who" id="who"></span>
        <button class="btn-ghost" type="button" id="logout">로그아웃</button>
      </div>
    </div>
  </header>

  <nav class="tabsbar" aria-label="운영 메뉴">
    <div class="tabsbar-in" role="tablist" id="tabs">
      <button class="tab" role="tab" type="button" data-tab="inquiries" aria-selected="true">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>문의 답변 <span class="tcount" id="tc-pending" hidden>0</span>
      </button>
      <button class="tab soon" role="tab" type="button" data-tab="reports" aria-selected="false">
        <svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/></svg>신고 검토 <span class="soonbadge">준비 중</span>
      </button>
      <button class="tab soon" role="tab" type="button" data-tab="review" aria-selected="false">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>검수 대기열 <span class="soonbadge">준비 중</span>
      </button>
      <button class="tab soon" role="tab" type="button" data-tab="aiqueue" aria-selected="false">
        <svg viewBox="0 0 24 24"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15l-1.9-4.1L5.5 9l4.6-1.4zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>AI 생성 큐 <span class="soonbadge">준비 중</span>
      </button>
    </div>
  </nav>

  <main class="wrap" id="panel" aria-live="polite"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  var URL_BASE = "https://nqgaqzpbhmezkrrlbbhm.supabase.co";
  var KEY = "sb_publishable_IThvI0wJJex8U4UiATHFyw_B_2jIphy";

  var sb = (typeof supabase!=="undefined" && supabase.createClient)
    ? supabase.createClient(URL_BASE, KEY)
    : null;

  var email=null, rows=[], filter="pending", activeTab="inquiries", entered=false;

  function $(id){return document.getElementById(id);}
  function esc(s){var d=document.createElement("div");d.textContent=(s==null?"":String(s));return d.innerHTML;}
  function show(id){["boot-view","login-view","console-view"].forEach(function(v){$(v).hidden=(v!==id);});}
  function fmtDate(s){if(!s)return "";try{var d=new Date(s);return d.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"})+" "+d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});}catch(e){return s;}}
  function cleanCat(t){return (t||"문의").replace(/^챗봇·/,"");}
  function isAnswered(r){return r&&(r.reply!=null&&String(r.reply).trim()!=="");}

  /* ---------- 로그인 ---------- */
  function loginMsg(t){var m=$("lg-msg");m.textContent=t;m.hidden=false;}
  function clearMsg(){$("lg-msg").hidden=true;}

  function loginGoogle(){
    if(!sb){loginMsg("로그인 모듈을 불러오지 못했어요. 새로고침해 주세요.");return;}
    clearMsg();
    sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.origin+window.location.pathname,queryParams:{prompt:"select_account"}}})
      .then(function(res){if(res&&res.error)loginMsg("구글 로그인을 시작하지 못했어요. 잠시 후 다시 시도해 주세요.");})
      .catch(function(){loginMsg("구글 로그인을 시작하지 못했어요.");});
  }

  function loginPassword(){
    if(!sb){loginMsg("로그인 모듈을 불러오지 못했어요. 새로고침해 주세요.");return;}
    var em=$("lg-email").value.trim(), pw=$("lg-pw").value;
    if(!em||!pw){loginMsg("이메일과 비밀번호를 모두 입력해 주세요.");return;}
    var btn=$("lg-btn");btn.disabled=true;btn.textContent="로그인 중…";clearMsg();
    sb.auth.signInWithPassword({email:em,password:pw}).then(function(res){
      btn.disabled=false;btn.textContent="로그인";
      if(res&&res.error){loginMsg("이메일 또는 비밀번호가 맞지 않아요. 구글 로그인을 쓰셨다면 위의 구글 버튼을 눌러 주세요.");return;}
      // onAuthStateChange 가 콘솔 진입 처리
    }).catch(function(){btn.disabled=false;btn.textContent="로그인";loginMsg("연결에 문제가 있어요. 잠시 후 다시 시도해 주세요.");});
  }

  function logout(){
    if(sb)sb.auth.signOut().catch(function(){});
    entered=false;email=null;rows=[];
    $("lg-pw").value="";
    show("login-view");$("lg-email").focus();
  }

  /* ---------- 콘솔 진입 ---------- */
  function enterConsole(session){
    if(entered)return; entered=true;
    email=(session&&session.user&&session.user.email)||email||"";
    $("who").textContent=email;
    show("console-view");
    setTab("inquiries");
  }

  function setTab(name){
    activeTab=name;
    Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){
      t.setAttribute("aria-selected", t.getAttribute("data-tab")===name?"true":"false");
    });
    if(name==="inquiries"){ loadList(); }
    else{ renderPlaceholder(name); }
  }

  function renderPlaceholder(name){
    var map={
      reports:{t:"신고 검토",d:"방문자가 신고한 콘텐츠를 여기서 확인하고 처리할 수 있게 됩니다. 다음 단계에서 연결돼요."},
      review:{t:"검수 대기열",d:"점역사 검수를 기다리는 촉각 그래픽을 모아 봅니다. 운영 기능 활성화 시 연결돼요."},
      aiqueue:{t:"AI 생성 큐",d:"매일 자동 생성된 촉각 그래픽 후보를 골라 공개합니다. 백엔드 파이프라인 준비 후 연결돼요."}
    };
    var info=map[name]||{t:"준비 중",d:"곧 제공돼요."};
    $("panel").innerHTML='<div class="empty"><span class="em-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><h3>'+esc(info.t)+' · 준비 중</h3><p>'+esc(info.d)+'</p></div>';
  }

  /* ---------- 문의 답변 ---------- */
  function loadList(){
    $("panel").innerHTML='<div class="loading"><span class="spin" aria-hidden="true"></span><div>문의를 불러오는 중…</div></div>';
    if(!sb){$("panel").innerHTML='<div class="empty"><p>로그인 모듈을 불러오지 못했어요.</p></div>';return;}
    sb.rpc("admin_list_inquiries").then(function(res){
      if(res&&res.error){
        var m=(res.error.message||"").toLowerCase();
        if(m.indexOf("jwt")>=0||m.indexOf("expired")>=0){logout();loginMsg("로그인이 만료됐어요. 다시 로그인해 주세요.");return;}
        $("panel").innerHTML='<div class="empty"><p>목록을 불러오지 못했어요. 새로고침을 눌러 다시 시도해 주세요.</p></div>';return;
      }
      rows=Array.isArray(res.data)?res.data:[];
      renderInquiries();
    }).catch(function(){$("panel").innerHTML='<div class="empty"><p>목록을 불러오지 못했어요.</p></div>';});
  }

  function updatePendingBadge(){
    var pending=rows.filter(function(r){return !isAnswered(r);}).length;
    var b=$("tc-pending");
    if(pending>0){b.textContent=pending;b.hidden=false;}else{b.hidden=true;}
  }

  function renderInquiries(){
    var total=rows.length, pending=rows.filter(function(r){return !isAnswered(r);}).length;
    updatePendingBadge();
    if(activeTab!=="inquiries")return;

    var panel=$("panel");
    panel.innerHTML="";
    var bar=document.createElement("div");bar.className="bar";
    bar.innerHTML='<span class="count">전체 <b>'+total+'</b>건 · <span class="pend">미답변 <b>'+pending+'</b>건</span></span>'+
      '<div class="filters" role="tablist" aria-label="문의 필터">'+
      '<button class="fchip" type="button" data-f="pending" aria-selected="'+(filter==="pending")+'">미답변</button>'+
      '<button class="fchip" type="button" data-f="all" aria-selected="'+(filter==="all")+'">전체</button></div>';
    panel.appendChild(bar);
    bar.querySelectorAll(".fchip").forEach(function(c){
      c.addEventListener("click",function(){filter=c.getAttribute("data-f");renderInquiries();});
    });
    var rrow=document.createElement("div");rrow.style.cssText="text-align:right;margin:-6px 2px 12px";
    var rb=document.createElement("button");rb.className="refresh";rb.type="button";
    rb.innerHTML='<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>새로고침';
    rb.onclick=loadList;rrow.appendChild(rb);panel.appendChild(rrow);

    var listEl=document.createElement("div");panel.appendChild(listEl);
    var shown = filter==="pending" ? rows.filter(function(r){return !isAnswered(r);}) : rows;
    if(!shown.length){
      var msg = filter==="pending" ? (total?"미답변 문의가 없어요. 모두 답하셨어요!":"아직 들어온 문의가 없어요.") : "아직 들어온 문의가 없어요.";
      listEl.innerHTML='<div class="empty"><span class="em-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></span><p>'+msg+'</p></div>';
      return;
    }
    shown.forEach(function(r){listEl.appendChild(cardFor(r));});
  }

  function cardFor(r){
    var answered=isAnswered(r);
    var card=document.createElement("div");card.className="card";
    var statusLabel=answered?"답변완료":(r.status==="처리중"?"처리중":"신규");
    var statusCls=answered?"done":(r.status==="처리중"?"prog":"new");
    var head='<div class="c-head"><span class="cat">'+esc(cleanCat(r.type))+'</span><span class="badge '+statusCls+'">'+statusLabel+'</span><span class="c-date">'+esc(fmtDate(r.created_at))+'</span></div>';
    var body='<div class="c-msg">'+esc(r.message)+'</div>';
    var mp=[];
    if(r.ticket)mp.push('<span class="tk">접수 '+esc(r.ticket)+'</span>');
    if(r.name)mp.push('<span>'+esc(r.name)+'</span>');
    if(r.email)mp.push('<a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a>');
    var meta='<div class="c-meta">'+mp.join("")+'</div>';
    var prev="";
    if(answered)prev='<div class="prev"><div class="prev-l">보낸 답변</div><div class="prev-t">'+esc(r.reply)+'</div>'+(r.replied_at?'<div class="prev-when">'+esc(fmtDate(r.replied_at))+'</div>':'')+'</div>';
    card.innerHTML=head+body+meta+prev;

    var wrap=document.createElement("div");wrap.className="reply";
    var ta=document.createElement("textarea");
    ta.placeholder=answered?"답변을 수정해 다시 보낼 수 있어요.":"답변을 입력하세요. 방문자가 챗봇에서 접수번호로 확인해요.";
    ta.setAttribute("aria-label","답변 내용");if(answered)ta.value=r.reply;
    var row=document.createElement("div");row.className="reply-row";
    var note=document.createElement("span");note.className="reply-note";
    note.textContent=r.email?"보내면 방문자가 챗봇에서 바로 확인해요.":"이 방문자는 이메일을 남기지 않았어요. 챗봇에서만 확인 가능해요.";
    var send=document.createElement("button");send.className="btn-send";send.type="button";
    send.textContent=answered?"답변 수정해 보내기":"답변 보내기";
    send.onclick=function(){
      var text=ta.value.trim();if(!text){ta.focus();return;}
      if(!r.ticket){row.innerHTML="";var e1=document.createElement("span");e1.className="sent";e1.style.color="#c0392b";e1.textContent="접수번호가 없어 답변을 연결할 수 없어요.";row.appendChild(e1);return;}
      send.disabled=true;send.textContent="보내는 중…";
      sendReply(r.ticket,text,function(ok){
        if(ok){r.reply=text;r.replied_at=new Date().toISOString();r.status="답변완료";renderInquiries();}
        else{send.disabled=false;send.textContent=answered?"답변 수정해 보내기":"답변 보내기";var keep=row.querySelector(".reply-note");row.innerHTML="";if(keep)row.appendChild(keep);var e2=document.createElement("span");e2.className="sent";e2.style.color="#c0392b";e2.textContent="답변을 보내지 못했어요. 잠시 후 다시 시도해 주세요.";row.appendChild(e2);}
      });
    };
    row.appendChild(note);row.appendChild(send);wrap.appendChild(ta);wrap.appendChild(row);card.appendChild(wrap);
    return card;
  }

  function sendReply(ticket,text,cb){
    if(!sb){cb(false);return;}
    sb.rpc("admin_reply_inquiry",{p_ticket:ticket,p_reply:text}).then(function(res){cb(!(res&&res.error));}).catch(function(){cb(false);});
  }

  /* ---------- 이벤트 ---------- */
  $("lg-google").addEventListener("click",loginGoogle);
  $("lg-btn").addEventListener("click",loginPassword);
  $("lg-pw").addEventListener("keydown",function(e){if(e.key==="Enter")loginPassword();});
  $("lg-email").addEventListener("keydown",function(e){if(e.key==="Enter")$("lg-pw").focus();});
  $("logout").addEventListener("click",logout);
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){
    t.addEventListener("click",function(){setTab(t.getAttribute("data-tab"));});
  });

  /* ---------- 시작: 세션 확인 ---------- */
  function start(){
    if(!sb){show("login-view");loginMsg("로그인 모듈을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.");return;}
    sb.auth.onAuthStateChange(function(event,session){
      if(session)enterConsole(session);
      else if(event==="SIGNED_OUT"){entered=false;show("login-view");}
    });
    sb.auth.getSession().then(function(res){
      var session=res&&res.data&&res.data.session;
      if(session)enterConsole(session);
      else{show("login-view");$("lg-email").focus();}
    }).catch(function(){show("login-view");});
  }
  start();
})();
</script>
</body>
</html>
