<style>
  :root{
    --accent:#FF4F00; --accent-dark:#E04500; --accent-deep:#E04500; --accent-tint:#FFF1EA; --accent-line:#FAD9C8;
    --cream:#FBF8F2; --paper:#FFFFFF; --card:#FFFFFF; --line:#ECE6DC; --line-2:#E2DACB;
    --ink:#1F1D1A; --ink-soft:#5C574E; --ink-faint:#9A9384; --ink-mute:#9A9384;
    --ok:#1f9d57; --ok-tint:#eaf7ef;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
    --fs-h1:32px;
    --r:14px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:999px;
    --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;font-size:15px}
  button{font-family:inherit;cursor:pointer}
  textarea,input{font-family:inherit}
  [hidden]{display:none!important}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-dot{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
  .brand-logo{height:24px;width:202px;flex:0 0 auto;background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjI0LjUgMTQuNSAzOTkuMyA0Ny40IiBmaWxsPSIjMTYxNTBmIj4gPGc+IDxwYXRoIGQ9Ik0xNTQuNSw1My45VjI5LjNoLTkuNFYyM2gyNS41djYuMmgtOS40djI0LjZMMTU0LjUsNTMuOUwxNTQuNSw1My45eiIvPiA8cGF0aCBkPSJNMTc3LjIsNTQuM2MtMi4zLDAtNC4zLTAuNi01LjgtMS45Yy0xLjUtMS4zLTIuMy0zLTIuMy01LjNWNDdjMC0yLjUsMC45LTQuNCwyLjYtNS42YzEuNy0xLjMsNC0xLjksNi45LTEuOSBjMiwwLDMuOSwwLjMsNS44LDFWNDBjMC0xLjQtMC40LTIuNS0xLjMtMy4yYy0wLjktMC43LTIuMS0xLjEtMy44LTEuMWMtMiwwLTQuMiwwLjQtNi41LDEuM2wtMS43LTUuMWMxLjQtMC42LDIuOS0xLjEsNC4zLTEuNCBjMS40LTAuMywzLTAuNSw0LjktMC41YzMuNiwwLDYuMiwwLjksOCwyLjZjMS43LDEuNywyLjUsNC4yLDIuNSw3LjV2MTMuN2gtNi41di0yLjZDMTgyLjUsNTMuMywxODAuMiw1NC4zLDE3Ny4yLDU0LjN6IE0xNzkuMiw0OS43YzEuNiwwLDIuOC0wLjQsMy44LTEuMmMxLTAuOCwxLjQtMS44LDEuNC0zdi0xLjJjLTEuMi0wLjYtMi43LTAuOS00LjMtMC45Yy0xLjQsMC0yLjYsMC4zLTMuNCwwLjggYy0wLjgsMC42LTEuMiwxLjQtMS4yLDIuNHYwLjFjMCwwLjksMC4zLDEuNiwxLDIuMUMxNzcuMyw0OS40LDE3OC4xLDQ5LjcsMTc5LjIsNDkuN3oiLz4gPHBhdGggZD0iTTIwNy43LDU0LjRjLTIuMywwLTQuNC0wLjUtNi4zLTEuN2MtMS45LTEuMS0zLjQtMi42LTQuNC00LjRjLTEuMS0xLjktMS42LTMuOS0xLjYtNi4xdi0wLjEgYzAtMi4yLDAuNS00LjMsMS42LTYuMmMxLTEuOSwyLjUtMy4zLDQuNC00LjVjMS45LTEuMSw0LTEuNyw2LjQtMS43YzIuMSwwLDMuOSwwLjMsNS40LDFjMS41LDAuNywyLjgsMS43LDQsM2wtNC4xLDQuNCBjLTAuOC0wLjktMS43LTEuNS0yLjUtMmMtMC44LTAuNC0xLjgtMC42LTIuOS0wLjZjLTEuNiwwLTMsMC42LTQuMSwxLjlTMjAyLDQwLjIsMjAyLDQydjAuMWMwLDEuOCwwLjYsMy40LDEuNiw0LjcgYzEuMSwxLjIsMi42LDEuOSw0LjMsMS45YzEuMSwwLDItMC4yLDIuOC0wLjZjMC44LTAuNCwxLjctMSwyLjYtMS45bDMuOSw0Yy0xLjMsMS40LTIuNiwyLjUtNC4xLDMuMiBDMjExLjcsNTQsMjA5LjksNTQuNCwyMDcuNyw1NC40eiIvPiA8cGF0aCBkPSJNMjI5LjcsNTQuMmMtMi4yLDAtMy45LTAuNS01LjEtMS42cy0xLjgtMi45LTEuOC01LjVWMzZIMjIwdi01LjdoMi44di02aDYuN3Y2aDUuNlYzNmgtNS42djEwLjEgYzAsMC44LDAuMiwxLjMsMC41LDEuN2MwLjMsMC40LDAuOSwwLjYsMS42LDAuNmMxLjIsMCwyLjMtMC4zLDMuMy0wLjh2NS40QzIzMy40LDUzLjgsMjMxLjcsNTQuMiwyMjkuNyw1NC4yeiIvPiA8cGF0aCBkPSJNMjQwLjEsMjQuN0wyNDAuMSwyNC43YzAt   .top .brand-logo{height:20px;width:168px}
  .brand-label{font-size:13px;font-weight:600;color:var(--ink-soft);padding-left:11px;border-left:1px solid var(--line)}
  .brand-tt{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.25}
  .brand-sub{display:block;font-size:12px;color:var(--ink-faint);margin-top:2px;line-height:1.2}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--r-sm);font-weight:600;font-size:14.5px;padding:12px 16px;transition:background .14s,opacity .14s,border-color .14s}

  /* ---------- 로그인 ---------- */
  .login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 30px;box-shadow:0 8px 30px rgba(40,30,15,.06)}
  .login-card .brand{margin-bottom:22px}
  .login-h{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
  .login-p{font-size:13.5px;color:var(--ink-soft);margin:0 0 22px}
  .btn-google{width:100%;background:#fff;color:#16150f;border:1px solid #dcdcdc;font-weight:600}
  .btn-google:hover{background:#f7f6f4;border-color:#cfcfcf}
  .or{display:flex;align-items:center;gap:10px;margin:18px 0 16px;color:var(--ink-faint);font-size:12px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
  .field input{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;font-size:14.5px;color:var(--ink);background:#fff;transition:border-color .14s,box-shadow .14s}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
  .btn-accent{background:var(--accent);color:#fff;width:100%}
  .btn-accent:hover{background:var(--accent-dark)}
  .btn-accent:disabled{opacity:.55;cursor:default}
  .msg{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:var(--r-sm);line-height:1.45}
  .msg.err{background:#fdecea;color:#c0392b;border:1px solid #f6d2cc}
  .booting{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink-faint);font-size:13.5px}

  /* ---------- 콘솔 ---------- */
  .top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
  .top-in{max-width:1180px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:12px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .who{font-size:12.5px;color:var(--ink-faint);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn-ghost{background:#fff;border:1px solid var(--line);border-radius:9px;color:var(--ink-soft);font-weight:600;font-size:12.5px;padding:8px 12px;transition:border-color .14s,color .14s}
  .btn-ghost:hover{border-color:var(--accent-line);color:var(--accent)}

  .tabsbar{background:#fff;border-bottom:1px solid var(--line)}
  .tabsbar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap}
  /* 상태 표준: 미선택 / hover / 선택 / 준비중 (탭·필터칩 공통) */
  .tab{display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;transition:background .14s,color .14s,border-color .14s,box-shadow .14s}
  .tab:hover{background:var(--accent-tint);border-color:var(--accent-line);color:var(--accent)}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(255,79,0,.28)}
  .tab.soon:not([aria-selected="true"]){color:var(--ink-mute)}
  .tab.soon:not([aria-selected="true"]) svg{opacity:.55}
  .tab.soon:not([aria-selected="true"]):hover{background:#f6f4f0;border-color:var(--line);color:var(--ink-soft)}
  .tab .tcount{background:var(--accent-tint);color:var(--accent);border-radius:999px;padding:0 7px;font-size:11px;font-weight:700;min-width:18px;text-align:center}
  .tab[aria-selected="true"] .tcount{background:rgba(255,255,255,.28);color:#fff}
  .tab .soonbadge{font-size:10px;background:#f1efe8;color:var(--ink-faint);border-radius:5px;padding:1px 6px;font-weight:600}
  .tab[aria-selected="true"] .soonbadge{background:rgba(255,255,255,.25);color:#fff}
  .tab svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px}
  .bar{display:flex;align-items:center;gap:14px;margin:4px 2px 16px;flex-wrap:wrap}
  .count{font-size:13px;color:var(--ink-soft)}
  .count b{color:var(--ink);font-weight:700}
  .count .pend{color:var(--accent)}
  .filters{display:flex;gap:6px;margin-left:auto}
  .fchip{background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--ink-soft);font-weight:600;font-size:12.5px;padding:6px 13px;transition:background .14s,color .14s,border-color .14s,box-shadow .14s}
  .fchip:hover{background:var(--accent-tint);border-color:var(--accent-line);color:var(--accent)}
  .fchip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(255,79,0,.28)}
  .refresh{background:none;border:none;color:var(--ink-faint);font-size:12.5px;font-weight:600;padding:6px 4px;display:inline-flex;align-items:center;gap:5px}
  .refresh:hover{color:var(--accent)}
  .refresh svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;margin-bottom:13px;animation:rise .26s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .cat{font-weight:700;font-size:14px;letter-spacing:-.01em}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .badge.new{background:var(--accent-tint);color:var(--accent)}
  .badge.done{background:var(--ok-tint);color:var(--ok)}
  .badge.prog{background:#fff4e0;color:#b8791a}
  .c-date{margin-left:auto;font-size:12px;color:var(--ink-faint)}
  .c-msg{background:var(--cream);border-radius:var(--r-sm);padding:12px 13px;font-size:14px;color:var(--ink);line-height:1.55;white-space:pre-wrap;word-break:break-word}

    var jobs=ct.map(function(t){return sb.from(t[0]).select("*",{count:"exact",head:true}).then(function(r){return (r&&r.error)?0:(r.count||0);}).catch(function(){return 0;});});
    var gJob=sb.from("graphics").select("*").eq("status","published").order("published_at",{ascending:false}).then(function(r){return (r&&!r.error&&Array.isArray(r.data))?r.data:[];}).catch(function(){return [];});
    var fJob=sb.from("feedback").select("stars").then(function(r){return (r&&!r.error&&Array.isArray(r.data))?r.data:[];}).catch(function(){return [];});
    Promise.all(jobs.concat([gJob,fJob])).then(function(res){
      if(activeTab!=="dashboard")return;
      var counts={};ct.forEach(function(t,i){counts[t[1]]=res[i];});
      var fb=res[ct.length+1]||[];
      var avg=fb.length?fb.reduce(function(a,b){return a+(+b.stars||0);},0)/fb.length:0;
      drawDashboard(counts,res[ct.length],avg);
    }).catch(function(){panel.innerHTML='<div class="empty"><p>대시보드를 불러오지 못했어요. 새로고침을 눌러 주세요.</p></div>';});
  }

  function drawDashboard(c,works,avg){
    works=works||[];avg=avg||0;
    var pub=works.length,dl=0,lk=0,free=0,g60=0,g96=0,cats={};
    works.forEach(function(w){
      dl+=(+w.downloads||0);lk+=(+w.likes||0);
      if(!w.price)free++;
      var sp=w.spec||"60×40";if(sp==="96×64")g96++;else g60++;
      var k=w.category||"기타";cats[k]=(cats[k]||0)+1;
    });
    var paid=pub-free;
    var catArr=Object.keys(cats).map(function(k){return [k,cats[k]];}).sort(function(a,b){return b[1]-a[1];});
    var maxc=catArr.length?catArr[0][1]:1;
    var kpis=[["photo","공개 작품",pub],["users","가입 사용자",c.users],["download","총 다운로드",dl],["heart","받은 좋아요",lk]];
    var kpiHtml=kpis.map(function(k){return '<div class="adm-kpi"><span class="adm-ic">'+svp(k[0])+'</span><div><div class="adm-v">'+nfmt(k[2])+'</div><div class="adm-l">'+esc(k[1])+'</div></div></div>';}).join("");
    var mini='<div class="adm-mini"><span class="adm-mi">무료 <b>'+nfmt(free)+'</b></span><span class="adm-mi">유료 <b>'+nfmt(paid)+'</b></span><span class="adm-mi">60×40 <b>'+nfmt(g60)+'</b></span><span class="adm-mi">96×64 <b>'+nfmt(g96)+'</b></span></div>';
    var bars=catArr.length?'<div class="adm-bars">'+catArr.map(function(x){var pct=Math.round(x[1]/maxc*100);return '<div class="adm-bar"><span class="adm-bl">'+esc(x[0])+'</span><span class="adm-bt"><span class="adm-bf" style="width:'+pct+'%"></span></span><span class="adm-bn">'+nfmt(x[1])+'</span></div>';}).join("")+'</div>':'<div class="adm-empty">아직 공개된 작품이 없어요.</div>';
    var comm=[["star","평가",c.reviews],["message-2","의뢰",c.commissions],["message","문의",c.inquiries],["flag","신고",c.reports],["license","요청",c.requests]];
    var commHtml=comm.map(function(x){return '<div class="adm-s2"><span class="adm-ic sm">'+svp(x[0])+'</span><b>'+nfmt(x[2])+'</b><span>'+esc(x[1])+'</span></div>';}).join("");
    var rr=Math.round(avg);
    var avgLine='<div class="adm-avg">평균 평점 <b>'+avg.toFixed(1)+'</b> <span class="adm-stars">'+"★".repeat(rr)+"☆".repeat(5-rr)+'</span></div>';
    var now=new Date(), months=[];
    for(var mi=5;mi>=0;mi--){months.push([new Date(now.getFullYear(),now.getMonth()-mi,1),0]);}
    works.forEach(function(w){if(!w.published_at)return;var d=new Date(w.published_at);for(var j=0;j<months.length;j++){if(months[j][0].getFullYear()===d.getFullYear()&&months[j][0].getMonth()===d.getMonth()){months[j][1]++;break;}}});
    var mmax=Math.max.apply(null,[1].concat(months.map(function(m){return m[1];})));
    var thisMonth=months.length?months[months.length-1][1]:0;
    var trend='<div class="adm-trend">'+months.map(function(m){var h=Math.round(m[1]/mmax*100);return '<div class="adm-tcol"><span class="adm-tn">'+nfmt(m[1])+'</span><span class="adm-ttrack"><span class="adm-tbar" style="height:'+h+'%"></span></span><span class="adm-tl">'+(m[0].getMonth()+1)+'월</span></div>';}).join("")+'</div>';
    var top5=works.slice().sort(function(a,b){return (b.likes||0)-(a.likes||0);}).slice(0,5);
    var top5Html=top5.length?top5.map(function(w,i){return '<div class="adm-row"><span class="adm-rt"><span class="adm-rank">'+(i+1)+'</span>'+esc(w.title||"제목 없음")+'</span><span class="adm-rm">♥ '+(w.likes||0)+' · ↓ '+(w.downloads||0)+'</span></div>';}).join(""):'<div class="adm-empty">표시할 작품이 없어요.</div>';
    var recent=works.slice(0,6);
    var recentHtml=recent.length?recent.map(function(w){return '<div class="adm-row"><span class="adm-rt">'+esc(w.title||"제목 없음")+'</span><span class="adm-rm">'+esc(w.category||"기타")+'</span></div>';}).join(""):'<div class="adm-empty">표시할 작품이 없어요.</div>';
    $("panel").innerHTML='<div class="page-wrap adm">'+
      '<div class="page-hd"><h1>데이터 대시보드</h1><p>플랫폼 데이터를 실시간으로 확인하고 운영해요.</p></div>'+
      '<div class="adm-kpis">'+kpiHtml+'</div>'+
      '<div class="adm-cols">'+
        '<section class="adm-block"><h2 class="adm-h2">콘텐츠 현황</h2>'+mini+bars+'</section>'+
        '<section class="adm-block"><h2 class="adm-h2">커뮤니티 현황</h2><div class="adm-stat2">'+commHtml+'</div>'+avgLine+'</section>'+
      '</div>'+
      '<section class="adm-block adm-full"><h2 class="adm-h2">월별 신규 작품 <span class="adm-h2x">이번 달 '+nfmt(thisMonth)+'건</span></h2>'+trend+'</section>'+
      '<div class="adm-cols">'+
        '<section class="adm-block adm-fill"><h2 class="adm-h2">인기 작품 Top 5</h2><div class="adm-recent">'+top5Html+'</div></section>'+
        '<section class="adm-block adm-fill"><h2 class="adm-h2">최근 업로드</h2><div class="adm-recent">'+recentHtml+'</div></section>'+
      '</div>'+
      '<section class="adm-block adm-full" id="sect-admins"><h2 class="adm-h2">관리자 설정</h2><div id="adm-body"><div class="adm-loading"><span class="spin" aria-hidden="true"></span>관리자를 불러오는 중…</div></div></section>'+
      '<section class="adm-block adm-full" id="sect-members"><h2 class="adm-h2">회원 관리</h2><div id="mem-body"><div class="adm-loading"><span class="spin" aria-hidden="true"></span>회원을 불러오는 중…</div></div></section>'+
      '<div style="text-align:right;margin-top:var(--s4)"><button class="adm-rm-btn" type="button" id="dash-refresh">'+svp("refresh")+'새로고침</button></div>'+
      '</div>';
    var rb=$("dash-refresh");if(rb)rb.onclick=renderDashboard;
    loadAdmins(); loadMembers(true);
  }

  /* ---------- 관리자 설정 ---------- */
  function setMsg(id,ok,text){var m=$(id);if(!m)return;if(!text){m.style.display="none";m.textContent="";return;}m.className="adm-msg "+(ok?"ok":"err");m.style.display="block";m.textContent=text;}
  function fmtDay(s){try{return new Date(s).toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"});}catch(e){return "";}}

  function loadAdmins(){
    if(!sb)return;
    sb.rpc("list_admins").then(function(r){
      admins=(r&&!r.error&&Array.isArray(r.data))?r.data:[];
      renderAdmins();
    }).catch(function(){admins=[];renderAdmins();});
  }
  function renderAdmins(){
    var body=$("adm-body");if(!body)return;
    var list=admins.length?'<div class="adm-admins">'+admins.map(function(a){
      var nm=a.name||a.email||"관리자",init=(String(nm).charAt(0)||"?").toUpperCase();
      return '<div class="adm-arow"><span class="adm-aav">'+esc(init)+'</span><span class="adm-an">'+esc(nm)+'</span><span class="adm-ae">'+esc(a.email||"")+'</span><button class="adm-rm-btn" type="button" data-rv="'+esc(a.user_id)+'">'+svp("trash")+'해제</button></div>';
    }).join("")+'</div>':'<div class="adm-empty">아직 등록된 관리자가 없어요.</div>';
    body.innerHTML='<p class="adm-desc">관리자를 추가하거나 해제할 수 있어요. 추가하려면 그 사람이 먼저 한 번 로그인한 적이 있어야 해요.</p><div class="adm-msg" id="adm-msg" style="display:none"></div><div class="adm-addrow"><input id="adm-email" type="email" placeholder="추가할 관리자 이메일 (예: name@dotincorp.com)" autocomplete="off"><button class="btn btn-accent" id="adm-addbtn" type="button">관리자 추가</button></div>'+list;
    $("adm-addbtn").onclick=addAdmin;
    $("adm-email").addEventListener("keydown",function(e){if(e.key==="Enter")addAdmin();});
    Array.prototype.forEach.call(body.querySelectorAll("[data-rv]"),function(b){b.onclick=function(){revokeAdmin(b.getAttribute("data-rv"));};});
  }
  function addAdmin(){
    var inp=$("adm-email");if(!inp)return;
    var em=inp.value.trim();
    if(!em){setMsg("adm-msg",false,"이메일을 입력해 주세요.");return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){setMsg("adm-msg",false,"이메일 형식으로 입력해 주세요 (예: name@dotincorp.com)");return;}
    if(admins.some(function(a){return (a.email||"").toLowerCase()===em.toLowerCase();})){setMsg("adm-msg",false,"이미 관리자예요.");return;}
    var btn=$("adm-addbtn");btn.disabled=true;setMsg("adm-msg",true,"");$("adm-msg").className="msg";
    sb.rpc("grant_admin",{target_email:em}).then(function(r){
      if($("adm-addbtn"))$("adm-addbtn").disabled=false;
      if(r&&r.error){setMsg("adm-msg",false,"오류가 발생했어요. 관리자 함수(SQL)가 적용됐는지 확인해 주세요.");return;}
      var d=r&&r.data;
      if(d&&d.ok){setMsg("adm-msg",true,(d.name||em)+" 님을 관리자로 추가했어요.");loadAdmins();}
      else if(d&&d.reason==="no_user"){setMsg("adm-msg",false,"그 이메일의 가입 사용자를 찾을 수 없어요. 먼저 한 번 로그인한 적이 있어야 해요.");}
      else if(d&&d.reason==="not_admin"){setMsg("adm-msg",false,"권한이 없어요.");}
      else{setMsg("adm-msg",false,"추가하지 못했어요.");}
    }).catch(function(){if($("adm-addbtn"))$("adm-addbtn").disabled=false;setMsg("adm-msg",false,"오류가 발생했어요.");});
  }
  function revokeAdmin(uid){
    var a=admins.filter(function(x){return String(x.user_id)===String(uid);})[0]||{};
    var nm=a.name||a.email||"이 관리자";
    if(typeof window!=="undefined"&&!window.confirm(nm+" 님의 관리자 권한을 해제할까요?"))return;
    sb.rpc("revoke_admin",{target_user:uid}).then(function(r){
      if(r&&r.error){setMsg("adm-msg",false,"오류가 발생했어요.");return;}
      var d=r&&r.data;
      if(d&&d.ok){setMsg("adm-msg",true,"관리자 권한을 해제했어요.");loadAdmins();}
      else if(d&&d.reason==="last_admin"){setMsg("adm-msg",false,"마지막 관리자는 해제할 수 없어요.");}
      else{setMsg("adm-msg",false,"해제하지 못했어요.");}
    }).catch(function(){setMsg("adm-msg",false,"오류가 발생했어요.");});
  }

  /* ---------- 회원 관리 ---------- */
  function loadMembers(reset){
    if(!sb)return;
    if(reset){memOff=0;}
    var arg={q:memQ,lim:30,off:memOff};
    if(memFlt&&memFlt!=="all")arg.flt=memFlt;
    sb.rpc("admin_list_users",arg).then(function(r){
      if(!r||r.error||!r.data){renderMembers(true);return;}
      var batch=Array.isArray(r.data.rows)?r.data.rows:[];
      members=memOff?members.concat(batch):batch;
      memTotal=typeof r.data.total==="number"?r.data.total:members.length;
      renderMembers(false);
    }).catch(function(){renderMembers(true);});
  }
  function renderMembers(sqlErr){
    var body=$("mem-body");if(!body)return;
    var chips=[["all","전체"],["pro","Pro"],["free","일반"]].map(function(f){
      return '<button class="fchip" type="button" data-flt="'+f[0]+'" aria-selected="'+(memFlt===f[0]?"true":"false")+'">'+f[1]+'</button>';
    }).join("");
    var bar='<div class="mem-bar"><div class="mem-bar-l">'+chips+'<span class="mem-count">총 '+nfmt(memTotal)+'명</span></div></div>'+
            '<div class="mem-search"><input id="mem-q" type="text" placeholder="이름·이메일 검색 후 Enter" value="'+esc(memQ)+'"></div>'+
            '<div class="adm-msg" id="mem-msg" style="display:none"></div>';
    var inner;
    if(sqlErr){inner='<div class="mem-empty">회원 목록을 불러오지 못했어요. 회원목록 SQL(admin_list_users)이 적용됐는지 확인해 주세요.</div>';}
    else if(!members.length){inner='<div class="mem-empty">조건에 맞는 회원이 없어요.</div>';}
    else{
      var head='<div class="mem-head"><span>회원</span><span>등급</span><span>가입일</span><span>관리</span></div>';
      var rowsH=members.map(function(u){
        var nm=u.name||u.email||"사용자",init=(String(nm).charAt(0)||"?").toUpperCase();
        var badge=u.pro?'<span class="mem-badge pro">Pro</span>':'<span class="mem-badge free">일반</span>';
        return '<div class="mem-row"><div class="mem-user"><span class="mem-av" style="background:linear-gradient(135deg,#16150F,#FF4F00)">'+esc(init)+'</span><div class="mem-u-meta"><div class="mem-name">'+esc(nm)+'</div><div class="mem-email">'+esc(u.email||"")+'</div></div></div>'+
          '<div>'+badge+'</div>'+
          '<div class="mem-date">'+(u.created_at?esc(fmtDay(u.created_at)):"-")+'</div>'+
          '<div class="mem-acts"><button class="adm-pro-btn'+(u.pro?" on":"")+'" type="button" data-pro="'+esc(u.user_id)+'">'+(u.pro?"Pro 해제":"Pro 부여")+'</button><button class="mem-btn del" type="button" data-del="'+esc(u.user_id)+'">탈퇴</button></div></div>';
      }).join("");
      inner='<div class="mem-table">'+head+rowsH+'</div>';
      if(members.length<memTotal){inner+='<div class="mem-pager"><button class="mem-btn" id="mem-more" type="button">더 보기</button><span class="mem-pager-info">'+members.length+' / '+memTotal+'</span></div>';}
    }
    body.innerHTML=bar+inner;
    $("mem-q").addEventListener("keydown",function(e){if(e.key==="Enter"){memQ=$("mem-q").value.trim();loadMembers(true);}});
    Array.prototype.forEach.call(body.querySelectorAll("[data-flt]"),function(b){b.onclick=function(){memFlt=b.getAttribute("data-flt");loadMembers(true);};});
    var mm=$("mem-more");if(mm)mm.onclick=function(){memOff=members.length;loadMembers(false);};
    Array.prototype.forEach.call(body.querySelectorAll("[data-pro]"),function(b){b.onclick=function(){togglePro(b.getAttribute("data-pro"));};});
    Array.prototype.forEach.call(body.querySelectorAll("[data-del]"),function(b){b.onclick=function(){deleteMember(b.getAttribute("data-del"));};});
  }
  function togglePro(uid){
    var u=members.filter(function(x){return String(x.user_id)===String(uid);})[0];if(!u)return;
    var val=!u.pro;
    sb.rpc("admin_set_pro",{target_user:uid,value:val}).then(function(r){
      if(!r||r.error||!(r.data&&r.data.ok)){setMsg("mem-msg",false,"변경하지 못했어요.");return;}
      u.pro=val;renderMembers(false);
      setMsg("mem-msg",true,(u.name||u.email||"사용자")+" 님을 "+(val?"Pro로 전환했어요.":"Pro 해제했어요."));
    }).catch(function(){setMsg("mem-msg",false,"오류가 발생했어요.");});
  }
  function deleteMember(uid){
    var u=members.filter(function(x){return String(x.user_id)===String(uid);})[0];if(!u)return;
    var em=u.email||"",nm=u.name||em||"이 사용자";
    if(typeof window!=="undefined"){
      if(!window.confirm(nm+(em?" ("+em+")":"")+" 계정을 완전 삭제할까요?\n\n이 사용자의 작품·평가·의뢰·문의·설정이 모두 삭제되며 되돌릴 수 없어요.\n(삭제 후 같은 이메일·구글로 새로 가입하는 건 가능해요.)"))return;
      var typed=window.prompt("확인을 위해 이 사용자의 이메일을 정확히 입력하세요:\n"+em);
      if(typed==null)return;
      if(typed.trim()!==em){setMsg("mem-msg",false,"이메일이 일치하지 않아 취소했어요.");return;}
    }
    sb.rpc("admin_delete_user",{target_user:uid}).then(function(r){
      if(r&&r.error){setMsg("mem-msg",false,"삭제 오류예요. 탈퇴 SQL(admin_delete_user)이 적용됐는지 확인해 주세요.");return;}
      var d=r&&r.data;
      if(d&&d.ok){members=members.filter(function(x){return String(x.user_id)!==String(uid);});memTotal=Math.max(0,memTotal-1);renderMembers(false);setMsg("mem-msg",true,nm+" 님 계정을 삭제했어요.");}
      else if(d&&d.reason==="is_admin"){setMsg("mem-msg",false,"관리자 계정은 삭제할 수 없어요. 먼저 관리자 권한을 해제하세요.");}
      else if(d&&d.reason==="not_admin"){setMsg("mem-msg",false,"권한이 없어요.");}
      else{setMsg("mem-msg",false,"삭제하지 못했어요.");}
    }).catch(function(){setMsg("mem-msg",false,"오류가 발생했어요.");});
  }

  /* ---------- 문의 답변 ---------- */
  function loadList(){
    $("panel").innerHTML='<div class="loading"><span class="spin" aria-hidden="true"></span><div>문의를 불러오는 중…</div></div>';
    if(!sb){$("panel").innerHTML='<div class="empty"><p>로그인 모듈을 불러오지 못했어요.</p></div>';return;}
    sb.rpc("admin_list_inquiries").then(function(res){
      if(res&&res.error){
        var m=(res.error.message||"").toLowerCase();
        if(m.indexOf("jwt")>=0||m.indexOf("expired")>=0){logout();loginMsg("로그인이 만료됐어요. 다시 로그인해 주세요.");return;}
        $("panel").innerHTML='<div class="empty"><p>목록을 불러오지 못했어요. 새로고침을 눌러 다시 시도해 주세요.</p></div>';return;
      }
      rows=Array.isArray(res.data)?res.data:[];
      renderInquiries();
    }).catch(function(){$("panel").innerHTML='<div class="empty"><p>목록을 불러오지 못했어요.</p></div>';});
  }

  function updatePendingBadge(){
    var pending=rows.filter(function(r){return !isAnswered(r);}).length;
    var b=$("tc-pending");
    if(pending>0){b.textContent=pending;b.hidden=false;}else{b.hidden=true;}
  }

  function renderInquiries(){
    var total=rows.length, pending=rows.filter(function(r){return !isAnswered(r);}).length;
    updatePendingBadge();
    if(activeTab!=="inquiries")return;

    var panel=$("panel");
    panel.innerHTML="";
    var bar=document.createElement("div");bar.className="bar";
    bar.innerHTML='<span class="count">전체 <b>'+total+'</b>건 · <span class="pend">미답변 <b>'+pending+'</b>건</span></span>'+
      '<div class="filters" role="tablist" aria-label="문의 필터">'+
      '<button class="fchip" type="button" data-f="pending" aria-selected="'+(filter==="pending")+'">미답변</button>'+
      '<button class="fchip" type="button" data-f="all" aria-selected="'+(filter==="all")+'">전체</button></div>';
    panel.appendChild(bar);
    bar.querySelectorAll(".fchip").forEach(function(c){
      c.addEventListener("click",function(){filter=c.getAttribute("data-f");renderInquiries();});
    });
    var rrow=document.createElement("div");rrow.style.cssText="text-align:right;margin:-6px 2px 12px";
    var rb=document.createElement("button");rb.className="refresh";rb.type="button";
    rb.innerHTML=svp("refresh")+"새로고침";
    rb.onclick=loadList;rrow.appendChild(rb);panel.appendChild(rrow);

    var listEl=document.createElement("div");panel.appendChild(listEl);
    var shown = filter==="pending" ? rows.filter(function(r){return !isAnswered(r);}) : rows;
    if(!shown.length){
      var msg = filter==="pending" ? (total?"미답변 문의가 없어요. 모두 답하셨어요!":"아직 들어온 문의가 없어요.") : "아직 들어온 문의가 없어요.";
      listEl.innerHTML='<div class="empty"><span class="em-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></span><p>'+msg+'</p></div>';
      return;
    }
    shown.forEach(function(r){listEl.appendChild(cardFor(r));});
  }

  function cardFor(r){
    var answered=isAnswered(r);
    var card=document.createElement("div");card.className="card";
    var statusLabel=answered?"답변완료":(r.status==="처리중"?"처리중":"신규");
    var statusCls=answered?"done":(r.status==="처리중"?"prog":"new");
    var head='<div class="c-head"><span class="cat">'+esc(cleanCat(r.type))+'</span><span class="badge '+statusCls+'">'+statusLabel+'</span><span class="c-date">'+esc(fmtDate(r.created_at))+'</span></div>';
    var body='<div class="c-msg">'+esc(r.message)+'</div>';
    var mp=[];
    if(r.ticket)mp.push('<span class="tk">접수 '+esc(r.ticket)+'</span>');
    if(r.name)mp.push('<span>'+esc(r.name)+'</span>');
    if(r.email)mp.push('<a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a>');
    var meta='<div class="c-meta">'+mp.join("")+'</div>';
    var prev="";
    if(answered)prev='<div class="prev"><div class="prev-l">보낸 답변</div><div class="prev-t">'+esc(r.reply)+'</div>'+(r.replied_at?'<div class="prev-when">'+esc(fmtDate(r.replied_at))+'</div>':'')+'</div>';
    card.innerHTML=head+body+meta+prev;

    var wrap=document.createElement("div");wrap.className="reply";
    var ta=document.createElement("textarea");
    ta.placeholder=answered?"답변을 수정해 다시 보낼 수 있어요.":"답변을 입력하세요. 방문자가 챗봇에서 접수번호로 확인해요.";
    ta.setAttribute("aria-label","답변 내용");if(answered)ta.value=r.reply;
    var row=document.createElement("div");row.className="reply-row";
    var note=document.createElement("span");note.className="reply-note";
    note.textContent=r.email?"보내면 방문자가 챗봇에서 바로 확인해요.":"이 방문자는 이메일을 남기지 않았어요. 챗봇에서만 확인 가능해요.";
    var send=document.createElement("button");send.className="btn-send";send.type="button";
    send.textContent=answered?"답변 수정해 보내기":"답변 보내기";
    send.onclick=function(){
      var text=ta.value.trim();if(!text){ta.focus();return;}
      if(!r.ticket){row.innerHTML="";var e1=document.createElement("span");e1.className="sent";e1.style.color="#c0392b";e1.textContent="접수번호가 없어 답변을 연결할 수 없어요.";row.appendChild(e1);return;}
      send.disabled=true;send.textContent="보내는 중…";
      sendReply(r.ticket,text,function(ok){
        if(ok){r.reply=text;r.replied_at=new Date().toISOString();r.status="답변완료";renderInquiries();}
        else{send.disabled=false;send.textContent=answered?"답변 수정해 보내기":"답변 보내기";var keep=row.querySelector(".reply-note");row.innerHTML="";if(keep)row.appendChild(keep);var e2=document.createElement("span");e2.className="sent";e2.style.color="#c0392b";e2.textContent="답변을 보내지 못했어요. 잠시 후 다시 시도해 주세요.";row.appendChild(e2);}
      });
    };
    row.appendChild(note);row.appendChild(send);wrap.appendChild(ta);wrap.appendChild(row);card.appendChild(wrap);
    return card;
  }

  function sendReply(ticket,text,cb){
    if(!sb){cb(false);return;}
    sb.rpc("admin_reply_inquiry",{p_ticket:ticket,p_reply:text}).then(function(res){cb(!(res&&res.error));}).catch(function(){cb(false);});
  }

  /* ---------- 이벤트 ---------- */
  $("lg-google").addEventListener("click",loginGoogle);
  $("lg-btn").addEventListener("click",loginPassword);
  $("lg-pw").addEventListener("keydown",function(e){if(e.key==="Enter")loginPassword();});
  $("lg-email").addEventListener("keydown",function(e){if(e.key==="Enter")$("lg-pw").focus();});
  $("logout").addEventListener("click",logout);
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){
    t.addEventListener("click",function(){setTab(t.getAttribute("data-tab"));});
  });

  /* ---------- 시작: 세션 확인 ---------- */
  function start(){
    if(!sb){show("login-view");loginMsg("로그인 모듈을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.");return;}
    sb.auth.onAuthStateChange(function(event,session){
      if(session)enterConsole(session);
      else if(event==="SIGNED_OUT"){entered=false;show("login-view");}
    });
    sb.auth.getSession().then(function(res){
      var session=res&&res.data&&res.data.session;
      if(session)enterConsole(session);
      else{show("login-view");$("lg-email").focus();}
    }).catch(function(){show("login-view");});
  }
  start();
})();
</script>
</body>
</html>
