<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tactile World · 검수 대기열 (관리자)</title>
<style>
  :root{
    --ink:#1F1D1A; --ink-soft:#5C574E; --ink-faint:#9A9384;
    --accent:#FF4F00; --line:#ECE6DC; --bg:#FAF8F3; --card:#fff;
    --ok:#0F6E56; --ok-bg:#E1F5EE; --danger:#C0392B; --danger-bg:#FBEAF0; --warn-bg:#FAEEDA;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;line-height:1.6;}
  .wrap{max-width:840px;margin:0 auto;padding:24px 18px 80px;}
  header.top{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  header.top h1{font-size:20px;margin:0;font-weight:700;}
  .sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 18px;}
  .badge{font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--warn-bg);color:#854F0B;}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .bar .grow{flex:1}
  .pager{font-size:12.5px;color:var(--ink-soft);min-width:64px;text-align:center;}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid #D9D5CC;background:#fff;color:var(--ink);padding:8px 14px;font-size:13.5px;}
  button:hover{background:#F4F1EA}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.accent{background:var(--accent);border-color:transparent;color:#fff;font-weight:700;}
  button.ghost{background:none;border-color:transparent;color:var(--danger);}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px 22px;text-align:center;color:var(--ink-soft);}
  .msg b{color:var(--ink);display:block;font-size:16px;margin-bottom:6px;}
  .msg a{color:var(--accent);font-weight:700;text-decoration:none;}
  .guide{background:#FFF7F2;border:1px solid #FFE0D2;border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;font-size:13px;color:#8A3A18;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;display:flex;gap:16px;}
  .pv{flex:0 0 auto;background:#F6F3EC;border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;align-items:center;justify-content:center;min-width:132px;min-height:100px;}
  .body{flex:1;min-width:0;}
  .ti{font-size:16px;font-weight:700;margin:0 0 2px;}
  .su{font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;}
  .chk{display:flex;flex-direction:column;gap:6px;margin:10px 0;}
  .chk label{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-soft);cursor:pointer;}
  .chk input{margin-top:3px}
  .reasons{display:none;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .reasons.on{display:flex}
  .rbtn{font-size:12.5px;padding:5px 10px;border-radius:999px;}
  .rbtn.sel{background:var(--danger-bg);border-color:#E9AFBD;color:#8A2540;font-weight:700;}
  .retc{display:none;width:100%;margin-top:6px}
  .retc.on{display:block}
  textarea{width:100%;font:inherit;font-size:13px;border:1px solid #D9D5CC;border-radius:8px;padding:8px;resize:vertical;min-height:52px;}
  .act{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;}
  .act .trust{margin-left:auto;font-size:12.5px;color:var(--ok);border-color:#B9E3D3;}
  .act .trust.on{background:var(--ok-bg);color:var(--ok);border-color:transparent;font-weight:700;}
  .done{opacity:.55}
  .result{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;}
  .result.ok{background:var(--ok-bg);color:var(--ok);}
  .result.no{background:var(--danger-bg);color:#8A2540;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#16150F;color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.on{opacity:.96}
  .foot{margin-top:24px;font-size:12px;color:var(--ink-faint);text-align:center;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>검수 대기열</h1>
    <span class="badge" id="count">…</span>
  </header>
  <p class="sub">제출된 촉각 그래픽을 기준에 맞춰 검수하고 공개해요. (관리자 전용)</p>

  <div class="guide">
    닷패드 저해상도(60×40 · 96×64)에서 <b>손끝으로 또렷이 읽히는지</b> 확인하세요.
    세 기준을 모두 통과해야 공개 승인됩니다.
  </div>

  <div class="bar">
    <button id="prev" type="button">← 이전</button>
    <span id="pager" class="pager"></span>
    <button id="next" type="button">다음 →</button>
    <div class="grow"></div>
    <button id="refresh" type="button">새로고침</button>
  </div>

  <div id="root" aria-live="polite">
    <div class="msg">불러오는 중…</div>
  </div>

  <div class="foot">
    이 페이지는 관리자 전용 검수 도구입니다. 메인 사이트에 관리자 계정으로 로그인되어 있어야 동작합니다.<br>
    승인/반려는 담당자·시각·사유가 기록됩니다(감사 추적).
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  var SB = window.__TIB_SB__ || {
    url: "https://nqgaqzpbhmezkrrlbbhm.supabase.co",
    key: "sb_publishable_IThvI0wJJex8U4UiATHFyw_B_2jIphy"
  };
  var root = document.getElementById("root");
  var countEl = document.getElementById("count");
  var toastEl = document.getElementById("toast");

  function toast(t){ toastEl.textContent=t; toastEl.classList.add("on"); setTimeout(function(){toastEl.classList.remove("on");},2200); }
  function msg(html){ root.innerHTML='<div class="msg">'+html+'</div>'; }

  if(!(window.supabase && window.supabase.createClient)){
    msg("<b>연결 라이브러리를 불러오지 못했어요.</b>네트워크 확인 후 새로고침해 주세요."); return;
  }
  var sb = window.supabase.createClient(SB.url, SB.key,
    { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } });

  /* ---- 실제 앱과 동일한 촉각 핀 렌더링 (원본 소스 로직 그대로) ---- */
  var DOT_BITS=[[0,0],[0,1],[0,2],[0,3],[1,0],[1,1],[1,2],[1,3]];
  function makeGrid(w,h){ var g=[]; for(var y=0;y<h;y++){ g.push(new Array(w).fill(false)); } return g; }
  function plot(g,x,y){ x=Math.round(x); y=Math.round(y); if(g[y]&&x>=0&&x<g[0].length&&y>=0) g[y][x]=true; }
  function decodeHex(hex,w,h){
    var g=makeGrid(w,h); if(!hex) return g; var cols=w/2;
    for(var i=0;i<hex.length;i+=2){
      var v=parseInt(hex.substr(i,2),16); if(isNaN(v)) continue;
      var cell=i/2, cx=cell%cols, cy=Math.floor(cell/cols);
      for(var k=0;k<8;k++){ if(v&(1<<k)){ plot(g, cx*2+DOT_BITS[k][0], cy*4+DOT_BITS[k][1]); } }
    }
    return g;
  }
  function dims(spec){ return spec==="96×64" ? [96,64] : [60,40]; }
  function drawPins(canvas, hex, spec){
    var wh=dims(spec), w=wh[0], h=wh[1], cell=(w===96?1.7:2.6);
    var grid=decodeHex(hex,w,h);
    var dpr=window.devicePixelRatio||1, pad=cell*.5;
    var W=w*cell+pad*2, H=h*cell+pad*2, r=cell*.4;
    canvas.width=W*dpr; canvas.height=H*dpr; canvas.style.width=W+"px"; canvas.style.height=H+"px";
    var ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);
    for(var y=0;y<h;y++) for(var x=0;x<w;x++){
      if(!grid[y][x]) continue;
      var cx=pad+x*cell+cell/2, cy=pad+y*cell+cell/2;
      ctx.beginPath(); ctx.arc(cx,cy+.5,r,0,7); ctx.fillStyle="rgba(0,0,0,.16)"; ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fillStyle="#16150F"; ctx.fill();
      ctx.beginPath(); ctx.arc(cx-r*.28,cy-r*.28,r*.35,0,7); ctx.fillStyle="rgba(255,255,255,.35)"; ctx.fill();
    }
  }

  var CRITERIA=["60×40에서 형태가 또렷이 읽히나요?","손끝으로 의미가 전달되나요?","설명(텍스트)이 정확한가요?"];
  var REASONS=["촉각으로 안 읽힘","점자 오류","중복","해상도 부적합","부적절한 내용"];

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  function firstHex(items){
    try{ if(Array.isArray(items)&&items[0]&&items[0].data) return items[0].data; }catch(e){}
    return "";
  }

  function render(rows){
    root.innerHTML="";
    rows.forEach(function(g){
      var card=document.createElement("div"); card.className="card";
      var checks=[false,false,false];
      var chosen=null, etcOn=false;

      var pv=document.createElement("div"); pv.className="pv";
      var cv=document.createElement("canvas"); pv.appendChild(cv);
      try{ drawPins(cv, firstHex(g.items), g.spec); }catch(e){ pv.textContent="미리보기 없음"; }

      var body=document.createElement("div"); body.className="body";
      body.innerHTML =
        '<p class="ti">'+esc(g.title||"제목 없음")+'</p>'+
        '<p class="su">'+esc(g.creator_name||"창작자")+' · '+esc(g.spec||"")+'</p>';

      var chk=document.createElement("div"); chk.className="chk";
      CRITERIA.forEach(function(c,idx){
        var lab=document.createElement("label");
        var cb=document.createElement("input"); cb.type="checkbox";
        cb.addEventListener("change",function(){ checks[idx]=cb.checked; syncApprove(); });
        lab.appendChild(cb); lab.appendChild(document.createTextNode(" "+c));
        chk.appendChild(lab);
      });
      body.appendChild(chk);

      var reasons=document.createElement("div"); reasons.className="reasons";
      REASONS.forEach(function(rz){
        var b=document.createElement("button"); b.type="button"; b.className="rbtn"; b.textContent=rz;
        b.addEventListener("click",function(){
          if(chosen===b){ chosen=null; b.classList.remove("sel"); }
          else { if(chosen) chosen.classList.remove("sel"); chosen=b; b.classList.add("sel"); }
        });
        reasons.appendChild(b);
      });
      var etcBtn=document.createElement("button"); etcBtn.type="button"; etcBtn.className="rbtn"; etcBtn.textContent="기타";
      var etc=document.createElement("textarea"); etc.className="retc"; etc.placeholder="기타 사유를 입력하세요.";
      etcBtn.addEventListener("click",function(){ etcOn=!etcOn; etc.classList.toggle("on",etcOn); etcBtn.classList.toggle("sel",etcOn); if(etcOn) etc.focus(); });
      reasons.appendChild(etcBtn);

      var act=document.createElement("div"); act.className="act";
      var approve=document.createElement("button"); approve.className="accent"; approve.textContent="승인 · 공개"; approve.disabled=true;
      var reject=document.createElement("button"); reject.className="ghost"; reject.textContent="반려";
      var confirmReject=document.createElement("button"); confirmReject.className="ghost"; confirmReject.textContent="반려 확정"; confirmReject.style.display="none";
      var trust=document.createElement("button"); trust.type="button"; trust.className="trust"; trust.textContent="신뢰 창작자로 지정";

      function syncApprove(){ approve.disabled = !(checks[0]&&checks[1]&&checks[2]); }

      function lock(v){ approve.disabled=v||!(checks[0]&&checks[1]&&checks[2]); reject.disabled=v; confirmReject.disabled=v; }
      function finish(kind){
        card.classList.add("done");
        act.innerHTML=""; chk.remove(); reasons.remove();
        var r=document.createElement("span"); r.className="result "+(kind==="approved"?"ok":"no");
        r.textContent=(kind==="approved"?"공개 승인됨":"반려됨"); act.appendChild(r);
        setTimeout(function(){ card.style.transition="opacity .4s"; card.style.opacity="0"; setTimeout(function(){ card.remove(); total=Math.max(0,total-1); updatePager(); if(!root.querySelector(".card")) loadPage(); },420); }, 700);
      }

      approve.addEventListener("click",function(){
        lock(true);
        sb.rpc("review_graphic",{ p_id:g.id, p_decision:"approve", p_note:null })
          .then(function(res){ if(res.error) throw res.error; toast("승인 · 공개했어요"); finish("approved"); })
          .catch(function(e){ lock(false); toast("실패: "+(e.message||"오류")); });
      });
      reject.addEventListener("click",function(){
        reasons.classList.add("on"); confirmReject.style.display=""; reject.style.display="none";
      });
      confirmReject.addEventListener("click",function(){
        var parts=[]; if(chosen) parts.push(chosen.textContent);
        var et=etc.value.trim(); if(et) parts.push(et);
        if(!parts.length){ toast("반려 사유를 선택하거나 입력해 주세요"); return; }
        var note=parts.join(" · ");
        lock(true);
        sb.rpc("review_graphic",{ p_id:g.id, p_decision:"reject", p_note:note })
          .then(function(res){ if(res.error) throw res.error; toast("반려했어요"); finish("rejected"); })
          .catch(function(e){ lock(false); toast("실패: "+(e.message||"오류")); });
      });

      trust.addEventListener("click",function(){
        if(!g.submitted_by){ toast("창작자 정보를 찾을 수 없어요"); return; }
        if(!window.confirm("이 창작자를 신뢰 창작자로 지정할까요?\n지정하면 이후 이 창작자의 업로드는 검수 없이 자동 공개됩니다.")) return;
        trust.disabled=true;
        sb.rpc("set_trusted",{ p_user:g.submitted_by, p_trusted:true })
          .then(function(res){ if(res.error) throw res.error; toast("신뢰 창작자로 지정했어요"); trust.textContent="신뢰 창작자 ✓"; trust.classList.add("on"); })
          .catch(function(e){ trust.disabled=false; toast("실패: "+(e.message||"오류")); });
      });
      act.appendChild(approve); act.appendChild(reject); act.appendChild(confirmReject); act.appendChild(trust);
      body.appendChild(reasons); body.appendChild(etc); body.appendChild(act);
      card.appendChild(pv); card.appendChild(body); root.appendChild(card);
    });
  }
  var PAGE_SIZE=10, page=0, total=0;
  var prevBtn=document.getElementById("prev"), nextBtn=document.getElementById("next"), pagerEl=document.getElementById("pager");

  function updatePager(){
    countEl.textContent = total+"건 대기";
    var from=page*PAGE_SIZE;
    pagerEl.textContent = total ? ((from+1)+"–"+Math.min(from+PAGE_SIZE,total)+" / "+total) : "";
    prevBtn.disabled = page<=0;
    nextBtn.disabled = (from+PAGE_SIZE)>=total;
  }

  function loadPage(){
    msg("불러오는 중…");
    var from=page*PAGE_SIZE, to=from+PAGE_SIZE-1;
    sb.from("graphics").select("id,title,creator_name,spec,items,created_at,submitted_by",{count:"exact"})
      .eq("status","pending").order("created_at",{ascending:true}).range(from,to)
      .then(function(res){
        if(res.error){ msg("<b>목록을 불러오지 못했어요.</b>"+esc(res.error.message||"")); return; }
        total=res.count||0;
        var rows=res.data||[];
        if(from>0 && rows.length===0){ page=Math.max(0,page-1); return loadPage(); }
        if(!rows.length){ root.innerHTML=""; msg("<b>검수할 작품이 없어요.</b>새로 제출된 그래픽이 여기에 표시됩니다."); updatePager(); return; }
        render(rows); updatePager();
      });
  }

  function load(){
    msg("불러오는 중…");
    sb.auth.getSession().then(function(r){
      var s=r&&r.data?r.data.session:null;
      if(!s){ msg('<b>관리자 로그인이 필요해요.</b>먼저 <a href="/#/">메인 사이트</a>에 관리자 계정으로 로그인한 뒤, 이 페이지를 새로고침해 주세요.'); return; }
      var uid=s.user&&s.user.id;
      sb.from("app_admins").select("user_id").eq("user_id",uid).maybeSingle().then(function(a){
        if(a.error||!a.data){ msg("<b>관리자 전용 페이지예요.</b>이 계정에는 검수 권한이 없어요."); return; }
        page=0; loadPage();
      });
    }).catch(function(){ msg("<b>세션 확인에 실패했어요.</b>새로고침해 주세요."); });
  }

  prevBtn.addEventListener("click",function(){ if(page>0){ page--; loadPage(); } });
  nextBtn.addEventListener("click",function(){ if((page+1)*PAGE_SIZE<total){ page++; loadPage(); } });
  document.getElementById("refresh").addEventListener("click", load);
  load();
})();
</script>
</body>
</html>
