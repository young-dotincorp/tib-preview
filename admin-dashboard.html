<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tactile World · 대시보드 (관리자)</title>
<link rel="stylesheet" href="admin-shell.css"/>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-shell.js"></script>
<script>
(function(){
  "use strict";
  AdminShell.mount({ active:"dashboard", title:"대시보드", icon:"ti-chart-bar" }).then(function(ctx){
    if(!ctx) return;
    var sb=ctx.sb, root=ctx.content, esc=ctx.esc;
    function n(x){ return (x==null?0:x).toLocaleString("ko-KR"); }
    function fmt(iso){ try{ return new Date(iso).toLocaleString("ko-KR"); }catch(e){ return ""; } }
    function bars(items,total,color){
      var max=Math.max(1,total||items.reduce(function(a,b){return a+(b.n||0);},0));
      return items.map(function(it){
        var pct=Math.round(((it.n||0)/max)*100);
        return '<div class="trow"><span class="k">'+esc(it.name)+'</span><span class="track"><span class="fill" style="width:'+pct+'%;'+(color?'background:'+color+';':'')+'"></span></span><span class="v">'+n(it.n)+'</span></div>';
      }).join("");
    }
    function kpi(val,label,href,cls,go){
      var inner='<div class="n">'+n(val)+'</div><div class="l">'+esc(label)+'</div>'+(go?'<span class="go">'+esc(go)+' <i class="ti ti-arrow-right"></i></span>':'');
      var c='kpi'+(cls?' '+cls:'');
      return href?'<a class="'+c+'" href="'+href+'">'+inner+'</a>':'<div class="'+c+'">'+inner+'</div>';
    }
    function render(d){
      var g=d.graphics||{},p=d.profiles||{},m=d.messages||{},cats=d.categories||[];
      var html="";
      html+='<div class="eyebrow">오늘 처리할 일</div><div class="kpis">';
      html+=kpi(g.pending,"검수 대기","admin-review.html",(g.pending>0?"warn":"ok"),"검수하러 가기");
      html+=kpi(m.inq_open,"미처리 문의","admin-inbox.html",(m.inq_open>0?"warn":"ok"),"메시지함 열기");
      html+=kpi(m.rep_open,"미처리 신고","admin-inbox.html",(m.rep_open>0?"warn":"ok"),"신고 보기");
      html+=kpi(g.published,"공개 그래픽",null,"ok","");
      html+='</div>';
      html+='<div class="eyebrow">전반 현황</div><div class="kpis">';
      html+=kpi(g.total,"전체 그래픽",null,"","");
      html+=kpi(p.trusted,"신뢰 창작자","admin-members.html","","전체 "+n(p.total)+"명 중");
      html+=kpi(g.uploaders,"업로드한 창작자",null,"","");
      html+=kpi(p.pro,"Pro 회원","admin-members.html","","");
      html+='</div>';
      html+='<div class="eyebrow">분포</div><div class="two">';
      html+='<div class="panel"><h3>상태</h3>'+bars([{name:"공개",n:g.published},{name:"검수 대기",n:g.pending},{name:"비공개",n:g.private},{name:"반려",n:g.rejected}],g.total)+'</div>';
      html+='<div class="panel"><h3>규격</h3>'+bars([{name:"60×40",n:g.spec_60x40},{name:"96×64",n:g.spec_96x64}],g.total,"var(--info)")+'</div>';
      html+='</div>';
      html+='<div class="panel"><h3>카테고리 (상위)</h3>'+bars(cats.map(function(c){return {name:c.name,n:c.n};}),g.total,"var(--violet)")+'</div>';
      html+='<div class="stamp">기준 시각 '+esc(fmt(d.generated_at))+'</div>';
      root.innerHTML=html;
    }
    root.innerHTML='<div class="msg">집계 불러오는 중…</div>';
    sb.rpc("admin_dashboard_stats").then(function(res){
      if(res.error){ root.innerHTML='<div class="msg"><b>집계를 불러오지 못했어요.</b>'+esc(res.error.message||"관리자 권한이 필요할 수 있어요.")+'</div>'; return; }
      try{ render(res.data||{}); }catch(e){ root.innerHTML='<div class="msg"><b>표시 중 오류가 났어요.</b>새로고침해 주세요.</div>'; }
    }).catch(function(){ root.innerHTML='<div class="msg"><b>집계 요청에 실패했어요.</b>새로고침해 주세요.</div>'; });
  });
})();
</script>
</body>
</html>
