const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap');

/* =========================================================================
   DESIGN TOKENS \u2014 \uB2E8\uC77C \uAE30\uC900\uAC12(Single Source of Truth)
   \uC55E\uC73C\uB85C \uBAA8\uB4E0 \uC2E0\uADDC \uC694\uC18C\uB294 \uC544\uB798 \uD1A0\uD070\uB9CC \uC0AC\uC6A9 (\uC784\uC758\uC758 px/\uC0C9\uC0C1 \uC9C1\uC811 \uC785\uB825 \uAE08\uC9C0)
   ========================================================================= */
.tib-root{
  /* color roles */
  --ink:#1F1D1A; --ink-soft:#5C574E; --ink-faint:#9A9384;
  --cream:#FBF8F2; --paper:#FFFFFF; --card:#FFFFFF; --line:#ECE6DC; --line-2:#E2DACB;
  --accent:#FF4F00; --accent-deep:#E04500; --accent-tint:#FFF1EA;
  --amber:#FF4F00; --blue:#2D6BD6; --green:#1F9D6B; --ok:#2FB36B;
  --pin-up:#1F1D1A; --pin-dn:#D9D1C0;
  /* type scale (9\uB2E8\uACC4 \uACE0\uC815) */
  --fs-display:52px; --fs-h1:32px; --fs-h2:24px; --fs-h3:18px; --fs-lead:16px;
  --fs-title:15px; --fs-body:14px; --fs-sm:13px; --fs-xs:12px; --fs-2xs:11px;
  --w-bold:700; --w-semi:600; --w-med:500; --w-reg:400;
  --lh-tight:1.14; --lh-snug:1.25; --lh-base:1.55;
  /* spacing \u2014 4/8pt grid */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  /* radius / shadow / layout */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-full:999px;
  --sh-1:0 4px 12px -6px rgba(31,29,26,.2);
  --sh-2:0 8px 24px -14px rgba(31,29,26,.26);
  --sh-pop:0 16px 32px -16px rgba(31,29,26,.3);
  --maxw:1480px; --gutter:28px;
  font-family:'Noto Sans KR','Noto Sans',system-ui,sans-serif; color:var(--ink);
  background:var(--cream); min-height:100vh; letter-spacing:-.005em;
  font-size:var(--fs-body); font-weight:var(--w-reg); line-height:var(--lh-base);
}
.tib-root *{box-sizing:border-box;}
.tib-root :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm);}
.tib-root :focus:not(:focus-visible){outline:none;}
.tib-shell{max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter);}
.skip{position:absolute;left:8px;top:8px;transform:translateY(-150%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;z-index:1000;font-size:14px;font-weight:600;transition:transform .15s;}
.skip:focus{transform:none;}

/* tactile world portal bar */
.tw-bar{background:var(--ink);color:#fff;position:relative;z-index:80;}
.tw-bar-inner{max-width:var(--maxw);margin:0 auto;padding:7px var(--gutter);display:flex;align-items:center;flex-wrap:wrap;gap:var(--s5);row-gap:2px;}
.tw-brand{display:inline-flex;align-items:center;border:none;background:none;padding:0;cursor:pointer;flex-shrink:0;order:1;}
.tw-brand svg{height:35px;width:auto;display:block;}
.tw-tabs{display:flex;align-items:center;gap:var(--s4);order:3;flex:0 0 100%;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding-top:2px;}
.tw-tabs::-webkit-scrollbar{display:none;}
.tw-actions{display:flex;align-items:center;gap:var(--s3);flex-shrink:0;order:2;margin-left:auto;}
.tw-actions .icbtn{color:rgba(255,255,255,.85);background:transparent;border-color:transparent;}
.tw-actions .icbtn:hover{background:rgba(255,255,255,.14);color:#fff;border-color:transparent;}
.tw-tab{display:inline-flex;align-items:center;gap:6px;height:58px;padding:0 14px;border:none;background:none;color:rgba(255,255,255,.6);font-family:inherit;font-size:var(--fs-body);font-weight:var(--w-med);cursor:pointer;position:relative;white-space:nowrap;}
.tw-tab:hover{color:#fff;}
.tw-tab.on{color:#fff;}
.tw-tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent);}
.tw-tab.soon.sel{color:#fff;}
.tw-soon{font-size:var(--fs-2xs);font-weight:var(--w-med);padding:1px 7px;border-radius:var(--r-full);background:rgba(255,255,255,.16);color:#fff;}
.tw-note{background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.12);}
.tw-note .tw-bar-inner{height:auto;min-height:42px;overflow:visible;padding-top:9px;padding-bottom:9px;gap:var(--s3);row-gap:16px;}
.tw-note-txt{flex:1;font-size:var(--fs-sm);color:rgba(255,255,255,.9);line-height:1.5;}
.tw-note-x{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:none;border-radius:var(--r-sm);background:rgba(255,255,255,.12);color:#fff;cursor:pointer;flex-shrink:0;}
.tw-note-x:hover{background:rgba(255,255,255,.22);}
/* breadcrumb */
.tw-crumb{display:flex;align-items:center;gap:5px;font-size:var(--fs-sm);color:var(--ink-soft);margin-bottom:var(--s3);flex-wrap:wrap;}
.tw-crumb button{border:none;background:none;font-family:inherit;font-size:inherit;color:var(--ink-soft);cursor:pointer;padding:0;display:inline-flex;align-items:center;}
.tw-crumb button:hover{color:var(--ink);text-decoration:underline;}
.tw-crumb svg{opacity:.45;}
.tw-crumb .cur{color:var(--ink);font-weight:var(--w-med);}
/* nav */
.tib-nav{display:flex;align-items:center;gap:18px;height:72px;margin-bottom:var(--s2);position:relative;z-index:60;background:var(--cream);}
.tib-nav::before{content:"";position:absolute;top:0;bottom:0;left:0;right:0;margin-left:calc(var(--gutter)*-1);margin-right:calc(var(--gutter)*-1);background:var(--cream);z-index:-1;}
.tib-logo{display:flex;align-items:center;margin-right:var(--s5);} .tib-logo svg{height:30px;width:auto;display:block;}
.tib-logo.is-dg svg{height:42px;}
.tib-link{color:var(--ink-soft);font-weight:var(--w-med);font-size:var(--fs-body);cursor:pointer;border:none;background:none;font-family:inherit;padding:0;display:inline-flex;align-items:center;gap:4px;}
.tib-link:hover{color:var(--ink);}
.sp{flex:1;}
.icbtn{width:38px;height:38px;border-radius:var(--r-full);border:1.5px solid var(--line);background:var(--paper);
  display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:border-color .15s,color .15s,background .15s;}
.icbtn:hover{background:var(--accent-tint);border-color:var(--accent);color:var(--accent);}
.av{width:38px;height:38px;border-radius:var(--r-full);position:relative;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);}
.av .on{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:var(--r-full);background:var(--ok);border:2px solid var(--cream);}
.av-guest{background:#8A93A0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.btn{font-family:inherit;font-weight:var(--w-semi);font-size:var(--fs-body);border-radius:var(--r-full);cursor:pointer;border:1.5px solid transparent;
  display:inline-flex;align-items:center;gap:var(--s2);padding:10px 16px;transition:transform .12s, background .15s, color .15s, border-color .15s;}
.btn:active{transform:translateY(1px) scale(.985);}
.btn:disabled{opacity:.45;cursor:default;}
.btn-ink{background:var(--ink);color:#fff;} .btn-ink:hover{background:#322f29;}
.btn-accent{background:var(--accent);color:#fff;} .btn-accent:hover{background:var(--accent-deep);}
.about-world .btn-accent{background:#1F1D1A;color:#fff;}
.about-world .btn-accent:hover{background:#000;}
.btn-danger{background:#D92D20;color:#fff;border-color:#D92D20;} .btn-danger:hover{background:#B42318;border-color:#B42318;}
.del-q{font-size:13px;color:var(--ink-soft);font-weight:600;align-self:center;margin-right:2px;white-space:nowrap;}
.btn-ghost{background:var(--paper);border-color:var(--line);color:var(--ink);} .btn-ghost:hover{border-color:var(--ink);}
.btn-ghost.copied{color:var(--ok);border-color:#BFE9D2;background:#F0FBF5;} .btn-ghost.copied:hover{border-color:#BFE9D2;}
.btn-amber{background:var(--accent);color:#fff;} .btn-amber:hover{background:var(--accent-deep);}

/* hero */
.tib-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:var(--s7);align-items:start;padding:var(--s7) 0 var(--s2);}
.tib-h1{font-weight:var(--w-bold);font-size:var(--fs-display);line-height:var(--lh-tight);letter-spacing:-.04em;margin:0 0 var(--s5);}

.fb-avg b{font-size:24px;font-weight:800;letter-spacing:-.02em;}
.fb-stars-static{display:inline-flex;gap:1px;color:var(--accent);}
.fb-cnt{font-size:12px;color:var(--ink-faint);}
.fb-hint{font-size:12px;color:var(--ink-soft);flex:1;min-width:160px;}
.fb-compose{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:9px;margin-bottom:12px;}
.fb-rate{display:flex;align-items:center;gap:10px;}
.fb-rate-l{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.fb-stars{display:inline-flex;}
.fb-star{background:none;border:none;cursor:pointer;padding:1px;color:var(--accent);display:inline-flex;}
.fb-input{width:100%;font-family:inherit;font-size:13px;color:var(--ink);background:var(--cream);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;outline:none;resize:vertical;min-height:44px;line-height:1.5;}
@keyframes fbNoteIn{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:none;}}
.fb-note{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:var(--w-semi);animation:fbNoteIn .18s ease;}
.fb-note.ok{color:var(--ok);}
.fb-note.err{color:#D92D20;}
.fb-input:focus{border-color:var(--accent);}
.fb-list{display:flex;flex-direction:column;gap:10px;}
.fb-item{border-top:1px solid var(--line);padding-top:10px;}
.fb-item-h{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.fb-who{font-size:12.5px;font-weight:700;}
.fb-item-stars{display:inline-flex;gap:1px;color:var(--accent);}
.fb-txt{font-size:12.5px;color:var(--ink-soft);line-height:1.55;}
.fb-own{display:flex;gap:var(--s4);margin-top:7px;}
.fb-mine{margin-left:8px;font-size:11px;font-weight:600;color:var(--accent-deep);background:#FFF4EE;border:1px solid #FFD9C6;border-radius:var(--r-full);padding:1px 8px;}
.fb-lk{background:none;border:none;font-family:inherit;font-size:12px;font-weight:600;color:var(--ink-faint);cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:2px 0;}
.fb-lk:hover{color:var(--ink);}
.fb-lk.d{color:#C0392B;}
.fb-lk.d:hover{color:#962D22;}
.fb-delq{margin-top:7px;font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.fb-edit{display:flex;flex-direction:column;gap:9px;}
.fb-edit-act{display:flex;gap:8px;}
.fb-btn-sm{padding:7px 16px;font-size:13px;justify-content:center;}
.cap-desc svg{flex:none;margin-top:1px;color:var(--accent-deep);}
.sect{margin:var(--s4) var(--s5);padding:var(--s4);border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--paper);}
.sect .st-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);}
.sect h4{margin:0 0 var(--s3);font-size:var(--fs-xs);font-weight:var(--w-semi);color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:var(--s2);}
.dev{display:flex;align-items:center;gap:var(--s3);font-weight:var(--w-semi);font-size:var(--fs-body);}
.dot{width:10px;height:10px;border-radius:var(--r-full);background:var(--ink-faint);} .dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(47,179,107,.18);}
.fmts{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2);}
@media(max-width:640px){.fmts{grid-template-columns:repeat(2,1fr);}}
.fmt{border:1.5px solid var(--line);background:#fff;border-radius:var(--r-md);padding:var(--s3);cursor:pointer;text-align:left;font-family:inherit;transition:border-color .15s;}
.fmt:hover{border-color:var(--accent);} .fmt:disabled{opacity:.5;cursor:default;}
.fmt .fl{font-weight:var(--w-semi);font-size:var(--fs-sm);display:flex;align-items:center;gap:var(--s1);} .fmt .fs{font-size:var(--fs-2xs);color:var(--ink-faint);margin-top:3px;}
.limit{margin:0 var(--s5) var(--s4);padding:var(--s4);border-radius:var(--r-md);border:1.5px dashed var(--accent);background:var(--accent-tint);display:flex;align-items:center;justify-content:space-between;gap:var(--s3);}
.limit .t{font-weight:var(--w-semi);font-size:var(--fs-body);} .limit .d{font-size:var(--fs-xs);color:var(--ink-soft);margin-top:2px;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-14px);}to{opacity:1;transform:translate(-50%,0);}}
.toast{position:fixed;left:50%;top:var(--s5);transform:translateX(-50%);z-index:210;width:fit-content;max-width:90vw;padding:var(--s2) var(--s5);border-radius:var(--r-full);background:var(--accent);color:#fff;font-weight:var(--w-semi);font-size:var(--fs-sm);display:flex;align-items:center;gap:var(--s2);box-shadow:var(--sh-2);animation:toastIn .22s ease;}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin:0 var(--s5) var(--s2);}
.chip{font-size:var(--fs-xs);font-weight:var(--w-med);color:var(--ink-soft);background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-full);padding:5px 11px;}
.chip-btn{font-family:inherit;cursor:pointer;transition:border-color .15s,color .15s;}
.chip-btn:hover{border-color:var(--accent);color:var(--accent-deep);}
.rel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.rel-card{text-align:left;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--paper);padding:8px;cursor:pointer;font-family:inherit;transition:border-color .15s,transform .15s,box-shadow .15s;}
.rel-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--sh-1);}
.rel-thumb{display:grid;place-items:center;background:var(--cream);border-radius:8px;overflow:hidden;min-height:58px;}
.rel-t{font-size:12px;font-weight:var(--w-semi);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);}
@media(max-width:560px){.rel-grid{grid-template-columns:repeat(2,1fr);}}
.mrow{display:flex;align-items:center;gap:var(--s4);margin:var(--s5) var(--s5) var(--s5);padding-top:var(--s4);border-top:1px solid var(--line);color:var(--ink-soft);font-size:var(--fs-sm);font-weight:var(--w-semi);}
.mrow span{display:inline-flex;align-items:center;gap:var(--s1);}

/* AI panel */
.ai-body{padding:0 var(--s5) var(--s7);}
.ai-input{display:flex;gap:var(--s2);margin-bottom:var(--s3);}
.ai-input input{flex:1;border:1.5px solid var(--line);border-radius:var(--r-md);padding:13px 15px;font-family:inherit;font-size:var(--fs-body);outline:none;}
.ai-input input:focus{border-color:var(--accent);}
.ai-kw{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s4);}
.ai-kw button{border:1.5px solid var(--line);background:var(--paper);border-radius:var(--r-full);padding:6px 13px;font-size:var(--fs-xs);font-weight:var(--w-med);cursor:pointer;font-family:inherit;}
.ai-kw button:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
.ai-stage{border-radius:var(--r-lg);background:var(--paper);border:1.5px solid var(--line);min-height:264px;display:grid;place-items:center;padding:var(--s6) var(--s5);margin-top:var(--s4);}
.pin-wrap{max-width:100%;max-height:340px;overflow:auto;border-radius:var(--r-md,12px);}
.ai-note{font-size:var(--fs-xs);color:var(--ink-faint);margin-top:var(--s5);line-height:var(--lh-base);text-align:center;}
.ai-err{display:flex;align-items:center;gap:8px;background:#FBE7E7;color:#B23B3B;font-size:13px;font-weight:600;padding:10px 14px;border-radius:10px;margin-top:var(--s3);}
.ai-err svg{flex:none;}
.ai-cap{text-align:center;margin-top:10px;font-size:12.5px;color:var(--ink-faint);font-weight:600;}
.ai-export-note{display:flex;align-items:flex-start;gap:8px;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:var(--s3);font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
.ai-export-note svg{color:var(--accent);flex:none;margin-top:1px;}
.ai-export-note b{color:var(--ink);}
.std-tabs{display:flex;gap:var(--s3);margin-bottom:var(--s4);border-bottom:1.5px solid var(--line);}
.std-tabs button{border:none;background:none;font-family:inherit;font-size:var(--fs-sm);font-weight:var(--w-semi);color:var(--ink-faint);padding:8px 4px 11px;margin-bottom:-1.5px;border-bottom:2.5px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.std-tabs button.act{color:var(--accent-deep);border-bottom-color:var(--accent);}
.std-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;border:2px dashed var(--line-2);border-radius:var(--r-md);padding:30px 18px;color:var(--ink-faint);font-size:var(--fs-sm);font-weight:var(--w-med);cursor:pointer;}
.std-drop:hover{border-color:var(--accent);background:var(--accent-tint);color:var(--accent-deep);}
.std-drop span{display:block;font-size:var(--fs-xs);margin-top:4px;}
.std-panel{background:#FCFAF6;border:1px solid var(--line);border-radius:var(--r-md,12px);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s4);margin-top:var(--s4);}
.std-row{display:flex;align-items:center;gap:var(--s3) var(--s4);flex-wrap:wrap;}
.ai-slider input[type=range]{flex:1;accent-color:var(--accent);height:5px;cursor:pointer;}
.std-chk{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:var(--w-med);cursor:pointer;}
.std-chk input{width:17px;height:17px;accent-color:var(--accent);}
.std-re{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:var(--w-semi);color:var(--ink-soft);cursor:pointer;text-decoration:underline;}
.std-actions{display:flex;gap:var(--s3);margin-top:var(--s5);flex-wrap:wrap;justify-content:center;}
.std-actions .btn{min-width:184px;justify-content:center;padding:12px 20px;}

.banner{background:#ECE8DE;color:var(--ink);text-align:center;font-size:var(--fs-sm);font-weight:var(--w-med);padding:13px;display:flex;align-items:center;justify-content:center;gap:var(--s3);position:relative;z-index:60;border-bottom:1px solid var(--line-2);}
.banner code{background:var(--paper);border:1px solid var(--line-2);padding:2px 8px;border-radius:6px;font-family:ui-monospace,monospace;color:var(--ink-soft);}
.banner-x{position:absolute;right:var(--gutter);top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:none;background:none;border-radius:var(--r-sm);color:var(--ink-soft);cursor:pointer;}
.banner-x:hover{background:rgba(31,29,26,.06);color:var(--ink);}

/* GNB dropdown menus (Dribbble\uC2DD) */
.menuwrap{position:relative;display:flex;}
.menuwrap.fopen{z-index:70;}
.avbtn{border:none;background:none;padding:0;cursor:pointer;display:flex;align-items:center;border-radius:var(--r-full);}
.avbtn:hover{box-shadow:0 0 0 3px var(--accent-tint);}
.menuback{position:fixed;inset:0;z-index:55;pointer-events:none;}
.menuback.dim{background:rgba(31,29,26,.45);backdrop-filter:blur(2px);pointer-events:auto;}
.navpanel{position:absolute;top:100%;left:0;right:0;margin-left:calc(var(--gutter)*-1);margin-right:calc(var(--gutter)*-1);z-index:5;background:var(--paper);
  border-bottom:1.5px solid var(--line);box-shadow:0 14px 26px rgba(31,29,26,.10);padding:var(--s2) var(--gutter) var(--s5);animation:npdrop .2s ease;}
@keyframes npdrop{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
.np-row{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;border:none;background:none;font-family:inherit;cursor:pointer;
  font-size:var(--fs-h3);font-weight:var(--w-semi);color:var(--ink);padding:var(--s4) 0;border-bottom:1px solid var(--line);}
.np-row:last-child{border-bottom:none;}
.np-row:hover{color:var(--accent-deep);}
.np-row.accent{color:var(--accent);}
@media(min-width:981px){.navpanel{display:none;}}
.menu{position:absolute;top:calc(100% + 10px);right:0;background:#fff;border:1.5px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--sh-pop);min-width:240px;padding:var(--s2);z-index:60;}
.menu .mi{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s3);border-radius:var(--r-sm);width:100%;text-align:left;border:none;background:none;font-family:inherit;
  font-size:var(--fs-body);font-weight:var(--w-med);color:var(--ink);cursor:pointer;white-space:nowrap;}
.menu .mi:hover{background:var(--cream);}
.menu .mi .gr{margin-left:auto;font-size:var(--fs-xs);color:var(--ink-faint);font-weight:var(--w-semi);}
.menu .sep{height:1px;background:var(--line);margin:var(--s2) 0;}
.menu .ph{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3) var(--s3);}
.menu .ph .phn{font-size:var(--fs-title);font-weight:var(--w-bold);}
.menu .ph .phu{font-size:var(--fs-xs);color:var(--ink-soft);font-weight:var(--w-med);display:flex;align-items:center;gap:var(--s1);margin-top:3px;}
.menu .menu-label{font-size:var(--fs-xs);font-weight:var(--w-bold);color:var(--ink-faint);letter-spacing:.04em;padding:9px var(--s3) 4px;}
.av.lg{width:46px;height:46px;}

/* hero rotating showcase (#1, Dribbble\uC2DD \uC790\uB3D9 \uD68C\uC804) */
.hs-stage{position:absolute;inset:0;}
.hs-layer{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .8s ease;}
.hs-layer.on{opacity:1;}
.hs-pause{position:absolute;bottom:var(--s4);left:var(--s4);width:30px;height:30px;border-radius:var(--r-full);border:1px solid var(--line);background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer;z-index:4;box-shadow:var(--sh-1);transition:background .15s;}
.hs-pause:hover{background:var(--cream);}
@keyframes hsfadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.hs-creator{position:absolute;bottom:var(--s4);right:var(--s4);display:flex;align-items:center;gap:8px;background:#fff;
  border-radius:var(--r-full);padding:7px 14px 7px 7px;box-shadow:var(--sh-1);z-index:3;}
.hs-av{width:24px;height:24px;border-radius:var(--r-full);flex-shrink:0;}
.hs-n{font-size:var(--fs-sm);font-weight:var(--w-semi);}
.hs-h{font-size:var(--fs-xs);color:var(--ink-faint);}
.hs-creator{animation:hsfadein .5s ease;}
@media(prefers-reduced-motion:reduce){.hs-layer{transition:none;}.hs-creator{animation:none;}.spin{animation:none;}}

/* filter dropdowns (#4) */
.fbtn{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);
  border-radius:var(--r-sm);padding:8px 13px;font-family:inherit;font-size:var(--fs-sm);font-weight:var(--w-med);color:var(--ink-soft);cursor:pointer;}
.fbtn:hover{border-color:var(--ink);color:var(--ink);}
.fbtn b{font-weight:var(--w-semi);color:var(--ink);}
.menu.fmenu{left:0;right:auto;min-width:172px;}
.menu .mi .ck{margin-left:auto;color:var(--accent);}

/* responsive (#3) */
@media(max-width:980px){
  .tib-root{--fs-display:40px;}
  .tib-hero{grid-template-columns:minmax(0,1fr);gap:var(--s5);padding-top:var(--s6);}
  .tib-herocard{display:none;}
  .tib-nav{gap:12px;}
  .tib-link{display:none;}
  .tib-nav .navham{display:grid;}
  .hide-m{display:none !important;}
}
@media(max-width:620px){
  .tib-root{--fs-display:32px;--gutter:18px;}
  .tib-grid{grid-template-columns:minmax(0,1fr);}
  .tib-stats .s{padding:0 var(--s4);}
  .modal{border-radius:var(--r-lg);}
  .ovl{padding:var(--s4) var(--s2);}
  .mh,.stage,.sect,.limit,.chiprow,.mrow,.ai-body{margin-left:var(--s4);margin-right:var(--s4);}
  .btn{padding:9px 13px;}
}
/* \uC81C\uC791\uC790 \uD398\uC774\uC9C0 */
.cre-head{display:flex;align-items:center;gap:var(--s4);padding:var(--s5) var(--s5) var(--s4);flex-wrap:wrap;}
.cre-av{width:64px;height:64px;border-radius:var(--r-full);flex:none;box-shadow:var(--sh-2);}
.cre-name{font-weight:var(--w-bold);font-size:var(--fs-h2);letter-spacing:-.02em;}
.cre-meta{font-size:var(--fs-sm);color:var(--ink-soft);margin-top:3px;}
.cre-stats{display:flex;justify-content:center;gap:var(--s7);padding:var(--s5);border-top:1px solid var(--line);flex-wrap:wrap;}
.cre-stat{text-align:center;}
.cre-stat b{display:block;font-size:28px;font-weight:var(--w-bold);letter-spacing:-.02em;margin-bottom:4px;}
.cre-stat span{font-size:var(--fs-sm);color:var(--ink-faint);}
.cre-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s5);padding:var(--s4) var(--s5) var(--s6);}
.cre-card{border:1.5px solid var(--line);border-radius:var(--r-xl);overflow:hidden;cursor:pointer;background:#fff;transition:border-color .15s,transform .12s,box-shadow .15s;}
.cre-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--sh-2);}
.cre-card .pv{background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:var(--s4);aspect-ratio:4/3;overflow:hidden;}
.cre-card .pv canvas,.rev-pv canvas{display:block;margin:auto;max-width:100%;height:auto;}
.cre-card .ti{font-size:var(--fs-body);font-weight:var(--w-semi);padding:var(--s5) var(--s4) 6px;line-height:1.4;}
.cre-card .mt2{font-size:var(--fs-sm);color:var(--ink-faint);padding:2px var(--s4) var(--s5);}
@media(max-width:760px){.cre-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:480px){.cre-grid{grid-template-columns:minmax(0,1fr);}}
/* \uAC80\uC218 \uB300\uAE30\uC5F4 */
.rev-steps{display:flex;align-items:flex-start;justify-content:center;padding:var(--s5) var(--s5) var(--s4);}
.rev-st{display:flex;flex-direction:column;align-items:center;text-align:center;flex:0 0 auto;width:128px;}
.rev-num{width:44px;height:44px;border-radius:var(--r-full);background:var(--accent-tint);color:var(--accent-deep);border:2px solid var(--accent);display:grid;place-items:center;font-weight:700;font-size:18px;}
.rev-st.act .rev-num{background:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-tint);}
.rev-stl{font-weight:700;font-size:14px;margin-top:10px;}
.rev-std{font-size:12px;color:var(--ink-faint);margin-top:3px;line-height:1.4;}
.rev-line{flex:1;max-width:200px;height:2px;background:var(--line);margin-top:21px;}
.browse-head{padding:var(--s6) 0 var(--s2);}
.browse-head h2{font-size:var(--fs-h1);letter-spacing:-.02em;margin:0;}
.browse-head p{color:var(--ink-soft);margin:8px 0 0;font-size:15px;}
.search-head{padding:var(--s6) 0 var(--s2);}
.search-head h2{font-size:var(--fs-h1);letter-spacing:-.02em;margin:0 0 var(--s4);}
.search-head h2 .em{color:var(--accent);}
.search-bar{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:var(--r-full);padding:12px 18px;max-width:520px;}
.search-bar input{flex:1;border:none;outline:none;font-family:inherit;font-size:15px;background:none;color:var(--ink);}
.search-rel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:var(--s4);}
.search-rel .lbl{font-size:12px;color:var(--ink-faint);font-weight:600;}
.sr{text-align:center;padding:var(--s7) 0 var(--s3);}
.sr h2{margin:var(--s5) 0 var(--s2);}
.sr .search-bar{margin:var(--s5) auto 0;}
.sr .search-rel{margin-top:var(--s3);}
.sr h2{margin:0 0 var(--s2);}
.sr-desc{color:var(--ink-soft);font-size:14.5px;line-height:1.6;max-width:620px;margin:0 auto var(--s4);}
.sr .search-rel{justify-content:center;}
.rev-guide{margin:0 var(--s5) var(--s5);background:var(--accent-tint);border:1px solid #FAD9C8;border-radius:var(--r-lg);padding:var(--s4) var(--s5);}

.tib-foot{border-top:1px solid var(--line);margin-top:var(--s8);padding:var(--s6) 0 var(--s5);}
.tf-main{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s6);flex-wrap:wrap;margin-bottom:var(--s5);}
.tf-logo{display:flex;align-items:center;} .tf-logo svg{height:32px;width:auto;display:block;}

/* \uD68C\uC0AC \uC18C\uAC1C */
.about{padding:var(--s7) 0 var(--s8);}
.about-hero{text-align:center;max-width:720px;margin:0 auto;}
.about-badge{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--accent-deep);background:var(--accent-tint);border:1px solid #FAD9C8;border-radius:var(--r-full);padding:6px 14px;margin-bottom:var(--s4);}
.about-hero h1{font-size:var(--fs-display);letter-spacing:-.03em;line-height:1.12;margin:0 0 var(--s3);}
.about-hero h1 .em{color:var(--accent);}
.about-hero p{font-size:17px;color:var(--ink-soft);line-height:1.65;margin:0 auto var(--s5);max-width:600px;}
.about-hero-cta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.about-panel{margin:var(--s7) auto 0;max-width:760px;background:var(--cream);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--s7) var(--s6);}
.about-panel .cap{text-align:center;font-size:12.5px;color:var(--ink-faint);margin-top:var(--s4);line-height:1.6;}
.about-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4);margin:var(--s7) 0 0;}
.about-stat{border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--s5) var(--s4);text-align:center;background:var(--paper);}

.about-stat span{font-size:13.5px;color:var(--ink-soft);font-weight:600;}
.about-sec{max-width:880px;margin:var(--s7) auto 0;}
.about-sec h2{font-size:var(--fs-h1);letter-spacing:-.02em;margin:0 0 var(--s4);border:none;padding:0;text-align:center;}
.about-sec .lead{text-align:center;color:var(--ink-soft);font-size:15px;max-width:620px;margin:0 auto var(--s6);line-height:1.7;}
.about-story{display:grid;grid-template-columns:1.4fr 1fr;gap:var(--s7);align-items:center;}
.about-story h2{text-align:left;}
.about-story p{font-size:15.5px;color:var(--ink-soft);line-height:1.8;margin:0 0 var(--s4);}
.about-story-art{background:var(--cream);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--s6);}
.about-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4);}
.about-step{border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);background:var(--paper);}
.about-step .no{font-size:11.5px;font-weight:800;color:var(--accent);letter-spacing:.06em;}
.about-step .ic{width:44px;height:44px;border-radius:14px;background:var(--accent-tint);color:var(--accent-deep);display:grid;place-items:center;margin:var(--s2) 0 var(--s3);}
.about-step h3{font-size:15.5px;margin:0 0 6px;}
.about-step p{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0;}
.about-who{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4);}
.about-card{border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);background:var(--paper);}
.about-svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5);max-width:940px;margin:0 auto;}
.about-svc-grid .about-card{display:flex;flex-direction:column;}
.about-svc-grid .svc-actions{margin-top:auto;padding-top:var(--s4);display:flex;gap:var(--s2);flex-wrap:wrap;}
@media(max-width:680px){.about-svc-grid{grid-template-columns:1fr;}}
.about-card .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-tint);display:grid;place-items:center;color:var(--accent-deep);margin-bottom:var(--s3);}
.about-card h3{font-size:15px;margin:0 0 6px;}
.about-card p{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0;}
.about-values{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s4);}
.about-value{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);background:var(--paper);}

.about-value h3{font-size:15px;margin:0 0 5px;}
.about-value p{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0;}
.about-final{margin:var(--s8) auto 0;max-width:880px;text-align:center;background:linear-gradient(135deg,var(--accent-tint),#FFF8F3);border:1px solid #FAD9C8;border-radius:var(--r-xl);padding:var(--s7) var(--s6);}
.about-final h2{font-size:var(--fs-h1);letter-spacing:-.02em;margin:0 0 var(--s2);border:none;padding:0;}
.about-final p{color:var(--ink-soft);font-size:15px;margin:0 0 var(--s5);}
@media(max-width:860px){.about-stats{grid-template-columns:repeat(2,1fr);}.about-story{grid-template-columns:1fr;}.about-story h2{text-align:center;}}
@media(max-width:680px){.about-steps,.about-who,.about-values{grid-template-columns:1fr;}.abr{display:none;}}
/* \uC815\uC801 \uD398\uC774\uC9C0(\uBB38\uC758\xB7\uC57D\uAD00\xB7\uAC1C\uC778\uC815\uBCF4) \uACF5\uD1B5 */
.page-wrap{max-width:760px;margin:0 auto;padding:var(--s7) 0 var(--s8);}
.page-hd{text-align:center;margin-bottom:var(--s6);}
.page-hd .badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-tint);color:var(--accent-deep);font-size:12px;font-weight:700;padding:5px 12px;border-radius:var(--r-full);margin-bottom:var(--s3);}
.page-hd h1{font-size:var(--fs-h1);letter-spacing:-.02em;margin:0 0 var(--s2);}
.page-hd p{color:var(--ink-soft);font-size:15px;line-height:1.65;margin:0 auto;max-width:560px;}
.page-note{display:flex;gap:9px;align-items:flex-start;background:var(--accent-tint);border:1px solid #FAD9C8;border-radius:var(--r-md);padding:11px 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:var(--s6);}
.page-note .ic{flex:none;color:var(--accent-deep);margin-top:1px;}
.legal-sec{margin-bottom:var(--s6);}
.legal-sec h2{font-size:16px;letter-spacing:-.01em;margin:0 0 var(--s3);padding-bottom:8px;border-bottom:1px solid var(--line);}
.legal-sec p{font-size:13.5px;color:var(--ink-soft);line-height:1.75;margin:0 0 10px;}
.legal-sec ul{margin:0 0 10px;padding-left:18px;}
.legal-sec li{font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin-bottom:6px;}
.legal-sec b{color:var(--ink);font-weight:700;}
.legal-upd{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid var(--line);}
.contact-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:var(--s5);align-items:start;}
.contact-form{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--s6);}
.contact-types{display:flex;gap:8px;flex-wrap:wrap;}
.contact-chip{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--cream);border:1.5px solid var(--line);border-radius:var(--r-full);padding:6px 13px;cursor:pointer;transition:all .12s;}
.contact-chip:hover{border-color:var(--ink-faint);}
.contact-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.contact-err{color:var(--accent-deep);font-size:12px;font-weight:600;margin-top:8px;}
.contact-side{display:flex;flex-direction:column;gap:var(--s3);}
.contact-info{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4) var(--s5);}
.contact-info h3{font-size:13.5px;margin:0 0 5px;display:flex;align-items:center;gap:7px;}
.contact-info p{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:0;}
.contact-info .v{color:var(--accent-deep);font-weight:600;}
.contact-sent{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--s7) var(--s6);text-align:center;}
.contact-sent .ic{width:56px;height:56px;border-radius:var(--r-full);background:var(--accent-tint);color:var(--accent-deep);display:grid;place-items:center;margin:0 auto var(--s4);}
.contact-sent h2{font-size:18px;margin:0 0 var(--s2);border:none;padding:0;}
.contact-sent p{font-size:13.5px;color:var(--ink-soft);line-height:1.65;margin:0 0 var(--s5);}
.tf-legal button{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer;padding:0;font-size:inherit;text-decoration:underline;text-underline-offset:2px;}
.tf-legal button:hover{color:var(--ink);}
.tf-legal .sep{margin:0 6px;opacity:.6;}
@media(max-width:680px){.contact-grid{grid-template-columns:1fr;}}
/* \uC694\uCCAD \uAC8C\uC2DC\uD310 */
.req-compose{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:var(--s5) var(--s6);margin-bottom:var(--s5);}
.req-compose h3{font-size:15px;margin:0 0 var(--s3);display:flex;align-items:center;gap:8px;}
.req-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4);}
.req-filters{display:flex;gap:7px;flex-wrap:wrap;}
.req-sort{display:inline-flex;background:var(--cream);border:1px solid var(--line);border-radius:var(--r-full);padding:3px;flex:none;}
.req-sort button{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:none;border:none;border-radius:var(--r-full);padding:6px 13px;cursor:pointer;}
.req-sort button.on{background:var(--paper);color:var(--ink);box-shadow:var(--sh-1);}
.req-list{display:flex;flex-direction:column;gap:var(--s4);}
.req-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);display:flex;gap:var(--s4);align-items:flex-start;}
.req-vote{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--paper);padding:9px 12px;cursor:pointer;min-width:56px;color:var(--ink-soft);transition:border-color .12s,background .12s,color .12s;}
.req-vote:hover{border-color:var(--ink-faint);}
.req-vote.on{border-color:var(--accent);background:var(--accent-tint);color:var(--accent-deep);}
.req-vote b{font-size:16px;font-weight:800;letter-spacing:-.02em;}
.req-vote span{font-size:10.5px;}
.req-body{flex:1;min-width:0;}
.req-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.req-title{font-size:15px;font-weight:700;margin:0;}
.req-cat{font-size:11.5px;font-weight:600;color:var(--ink-soft);background:var(--cream);border-radius:var(--r-full);padding:2px 9px;}
.req-status{font-size:11px;font-weight:700;border-radius:var(--r-full);padding:2px 9px;}
.req-status.open{background:#EEF3FF;color:var(--blue);}
.req-status.making{background:var(--accent-tint);color:var(--accent-deep);}
.req-status.done{background:#E7F7EF;color:var(--green);}
.req-desc{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0 0 6px;}
.req-meta{font-size:12px;color:var(--ink-faint);}
.req-empty{text-align:center;color:var(--ink-faint);padding:var(--s7) 0;font-size:13.5px;}
.ib-count{margin-left:6px;font-size:12px;color:var(--ink-faint);font-weight:600;}
.ib-list{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4) 0 var(--s8);}
.ib-card{border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--paper);padding:var(--s4);}
.ib-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:8px;}
.ib-badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:var(--r-full);background:var(--cream);color:var(--ink-soft);border:1px solid var(--line);}
.ib-badge.st-open{color:var(--accent-deep);background:#FFF4EE;border-color:#FFD9C6;}
.ib-badge.st-making{color:#8A6D00;background:#FFF8E6;border-color:#F0E2B0;}
.ib-badge.st-done{color:#2E7D32;background:#EDF7EE;border-color:#CDE7CF;}
.ib-date{font-size:12px;color:var(--ink-faint);white-space:nowrap;}
.ib-who{font-weight:700;color:var(--ink);}
.ib-email{font-weight:500;color:var(--ink-faint);font-size:var(--fs-sm);margin-left:8px;}
.ib-title{font-weight:700;color:var(--ink);}
.ib-cat{font-weight:600;color:var(--ink-faint);font-size:12px;margin-left:8px;}
.ib-msg{margin-top:6px;color:var(--ink-soft);font-size:var(--fs-sm);line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.ib-meta{margin-top:8px;font-size:12px;color:var(--ink-faint);}
.ib-stars{color:var(--accent);font-size:15px;letter-spacing:1px;}
.ib-empty{padding:var(--s7) 0;text-align:center;color:var(--ink-faint);}
.ib-empty p{margin-top:10px;font-weight:600;}
.req-posted{display:flex;align-items:center;gap:7px;background:#E7F7EF;color:var(--green);border:1px solid #C7EBD8;border-radius:var(--r-md);padding:10px 13px;font-size:13px;font-weight:600;margin-bottom:var(--s4);}
.req-card.just{animation:reqflash 2.6s ease;}
@keyframes reqflash{0%{background:var(--accent-tint);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);transform:translateY(-6px);}15%{transform:translateY(0);}100%{background:var(--card);border-color:var(--line);box-shadow:none;}}
.req-new{font-size:11px;font-weight:700;border-radius:var(--r-full);padding:2px 9px;background:var(--accent);color:#fff;}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(max-width:560px){.req-bar{align-items:stretch;}.req-sort{align-self:flex-start;}}
/* \uD65C\uB3D9 \uD53C\uB4DC */
.feed-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:var(--s5);}
.feed{display:flex;flex-direction:column;}
.feed-item{display:flex;gap:14px;padding:var(--s4) 0;border-bottom:1px solid var(--line);}

.feed-body{flex:1;min-width:0;}
.feed-txt{font-size:13.5px;color:var(--ink);line-height:1.55;}

.feed-tgt{color:var(--accent-deep);font-weight:600;}
.feed-time{font-size:12px;color:var(--ink-faint);margin-top:3px;}
.feed-empty{text-align:center;color:var(--ink-faint);padding:var(--s7) 0;font-size:13.5px;}

.notif-btn{position:relative;}

.notif-sub{font-size:11.5px;color:var(--ink-faint);}

.notif-item .feed-ic{width:30px;height:30px;}
.notif-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.notif-txt{font-size:12.5px;color:var(--ink);line-height:1.45;}
.notif-time{font-size:11px;color:var(--ink-faint);}
.notif-all{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:none;border:none;padding:12px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--accent-deep);}
.notif-all:hover{background:var(--accent-tint);}

.backtop{position:fixed;right:var(--s5);bottom:var(--s5);z-index:120;width:46px;height:46px;border-radius:var(--r-full);border:1px solid var(--line);background:#fff;color:var(--ink);box-shadow:var(--sh-2);display:grid;place-items:center;cursor:pointer;}
.backtop:hover{background:var(--cream);}
/* \uAC00\uACA9 */
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4);padding:var(--s4) var(--s5) var(--s6);}

.ag-note{display:flex;gap:12px;align-items:flex-start;margin:0 var(--s5) var(--s4);padding:14px 16px;background:var(--accent-tint);border:1px solid #FAD9C8;border-radius:var(--r-lg);}
.ag-note>div{font-size:13.5px;line-height:1.55;color:var(--ink);}
.ag-note b{font-weight:700;}
.ag-note-sub{font-size:12px;color:var(--ink-faint);margin-top:5px;}
.ag-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 var(--s5) var(--s3);}
.ag-all{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;cursor:pointer;}
.ag-all input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;}
.ag-scroll{flex:1;min-height:0;overflow-y:auto;}
.ag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 var(--s5) var(--s5);}
.ag-card{position:relative;border:1.5px solid var(--line);border-radius:var(--r-lg);padding:10px;cursor:pointer;background:var(--paper);transition:border-color .15s,box-shadow .15s;}
.ag-card:hover{border-color:var(--accent);}
.ag-card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-tint);}
.ag-card.dup{opacity:.55;cursor:not-allowed;}
.ag-check{position:absolute;top:11px;left:11px;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-2);background:#fff;display:grid;place-items:center;color:#fff;z-index:2;transition:background .15s,border-color .15s;}
.ag-card.on .ag-check{background:var(--accent);border-color:var(--accent);}
.ag-x{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:var(--r-full);border:none;background:rgba(255,255,255,.92);color:var(--ink-soft);display:grid;place-items:center;cursor:pointer;z-index:2;box-shadow:var(--sh-1);}
.ag-x:hover{background:#FBE7E7;color:#B23B3B;}
.ag-thumb{display:grid;place-items:center;background:var(--cream);border-radius:10px;overflow:hidden;min-height:104px;margin-top:4px;}
.ag-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;}
.ag-mt{min-width:0;}
.ag-t{font-size:13.5px;font-weight:var(--w-semi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ag-s{font-size:11px;color:var(--ink-faint);}
.ag-like{flex:none;border:none;background:none;color:var(--ink-faint);cursor:pointer;padding:3px;display:grid;place-items:center;border-radius:var(--r-full);}
.ag-like:hover,.ag-like.on{color:var(--accent);}
.ag-badge.dup{position:absolute;top:11px;left:11px;background:#EDEAE3;color:var(--ink-faint);font-size:11px;font-weight:700;border-radius:var(--r-full);padding:3px 9px;z-index:2;}
.ag-foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px var(--s5);background:var(--paper);border-top:1px solid var(--line);}
.ag-stats{display:flex;gap:16px;font-size:13px;color:var(--ink-soft);}
.ag-stats b{color:var(--ink);font-size:14.5px;}
@media(max-width:680px){.ag-grid{grid-template-columns:repeat(2,1fr);}.ag-foot{flex-direction:column;align-items:stretch;}.ag-stats{justify-content:space-around;}}

        ["\uC81C1\uC870 (\uBAA9\uC801)", ["\uBCF8 \uC57D\uAD00\uC740 Dot Inc.(\uC774\uD558 \u201C\uD68C\uC0AC\u201D)\uAC00 \uC81C\uACF5\uD558\uB294 \uCD09\uAC01 \uADF8\uB798\uD53D \uACF5\uC720\xB7\uBC30\uD3EC \uD50C\uB7AB\uD3FC Tactile World(\uC774\uD558 \u201C\uC11C\uBE44\uC2A4\u201D)\uC758 \uC774\uC6A9\uACFC \uAD00\uB828\uD558\uC5EC \uD68C\uC0AC\uC640 \uC774\uC6A9\uC790 \uAC04\uC758 \uAD8C\uB9AC\xB7\uC758\uBB34 \uBC0F \uCC45\uC784\uC0AC\uD56D\uC744 \uADDC\uC815\uD568\uC744 \uBAA9\uC801\uC73C\uB85C \uD569\uB2C8\uB2E4."]],
        ["\uC81C2\uC870 (\uC815\uC758)", [["\u201C\uC774\uC6A9\uC790\u201D\uB780 \uBCF8 \uC57D\uAD00\uC5D0 \uB530\uB77C \uC11C\uBE44\uC2A4\uB97C \uC774\uC6A9\uD558\uB294 \uD68C\uC6D0 \uBC0F \uBE44\uD68C\uC6D0\uC744 \uB9D0\uD569\uB2C8\uB2E4.", "\u201C\uCC3D\uC791\uC790\u201D\uB780 \uCD09\uAC01 \uADF8\uB798\uD53D\uC744 \uC81C\uC791\xB7\uC5C5\uB85C\uB4DC\uD558\uB294 \uC774\uC6A9\uC790\uB97C \uB9D0\uD569\uB2C8\uB2E4.", "\u201C\uCD09\uAC01 \uADF8\uB798\uD53D\u201D\uC774\uB780 \uB2F7\uD328\uB4DC \uD540 \uADF8\uB9AC\uB4DC(60\xD740\xB796\xD764)\uC5D0 \uB9DE\uCDB0 \uC81C\uC791\xB7\uBC30\uD3EC\uB418\uB294 .dtms \uB4F1 \uD615\uC2DD\uC758 \uCF58\uD150\uCE20\uB97C \uB9D0\uD569\uB2C8\uB2E4.", "\u201C\uAC80\uC218\u201D\uB780 \uACF5\uAC1C \uC804 \uC810\uC5ED\uC0AC\xB7\uAD50\uC0AC\uAC00 \uC190\uB05D \uAC00\uB3C5\uC131\uC744 \uD655\uC778\uD558\uB294 \uC808\uCC28\uB97C \uB9D0\uD569\uB2C8\uB2E4."]]],
        ["\uC81C3\uC870 (\uC57D\uAD00\uC758 \uD6A8\uB825 \uBC0F \uBCC0\uACBD)", ["\uBCF8 \uC57D\uAD00\uC740 \uC11C\uBE44\uC2A4 \uD654\uBA74\uC5D0 \uAC8C\uC2DC\uD568\uC73C\uB85C\uC368 \uD6A8\uB825\uC774 \uBC1C\uC0DD\uD569\uB2C8\uB2E4.", "\uD68C\uC0AC\uB294 \uAD00\uB828 \uBC95\uB839\uC744 \uC704\uBC18\uD558\uC9C0 \uC54A\uB294 \uBC94\uC704\uC5D0\uC11C \uC57D\uAD00\uC744 \uBCC0\uACBD\uD560 \uC218 \uC788\uC73C\uBA70, \uBCC0\uACBD \uC2DC \uC801\uC6A9\uC77C\uC790\uC640 \uC0AC\uC720\uB97C \uBA85\uC2DC\uD558\uC5EC \uC0AC\uC804 \uACF5\uC9C0\uD569\uB2C8\uB2E4."]],
        ["\uC81C4\uC870 (\uD68C\uC6D0\uAC00\uC785 \uBC0F \uACC4\uC815)", ["\uC774\uC6A9\uC790\uB294 \uC815\uD655\uD55C \uC815\uBCF4\uB85C \uAC00\uC785\uD574\uC57C \uD558\uBA70, \uACC4\uC815 \uC815\uBCF4\uC758 \uAD00\uB9AC \uCC45\uC784\uC740 \uC774\uC6A9\uC790\uC5D0\uAC8C \uC788\uC2B5\uB2C8\uB2E4.", "\uD0C0\uC778\uC758 \uC815\uBCF4\uB97C \uB3C4\uC6A9\uD558\uAC70\uB098 \uACC4\uC815\uC744 \uBB34\uB2E8\uC73C\uB85C \uACF5\uC720\uD558\uB294 \uD589\uC704\uB294 \uAE08\uC9C0\uB429\uB2C8\uB2E4."]],
        ["\uC81C5\uC870 (\uCF58\uD150\uCE20\uC640 \uB77C\uC774\uC120\uC2A4)", ["\uCD09\uAC01 \uADF8\uB798\uD53D\uC740 <b>\uBB34\uB8CC \xB7 CC \xB7 Pro</b> \uB4F1 \uB77C\uC774\uC120\uC2A4 \uB4F1\uAE09\uC5D0 \uB530\uB77C \uC774\uC6A9 \uBC94\uC704\uAC00 \uB2E4\uB974\uBA70, \uC774\uC6A9\uC790\uB294 \uAC01 \uCF58\uD150\uCE20\uC5D0 \uD45C\uC2DC\uB41C \uB77C\uC774\uC120\uC2A4 \uC870\uAC74\uC744 \uC900\uC218\uD574\uC57C \uD569\uB2C8\uB2E4.", "\uC720\uB8CC(Pro) \uB77C\uC774\uC120\uC2A4 \uCF58\uD150\uCE20\uC758 \uAD8C\uB9AC\uB294 \uD574\uB2F9 \uCC3D\uC791\uC790 \uBC0F \uD68C\uC0AC\uC5D0 \uC788\uC73C\uBA70, \uD5C8\uC6A9\uB41C \uBC94\uC704\uB97C \uB118\uB294 \uBCF5\uC81C\xB7\uC7AC\uBC30\uD3EC\uB294 \uAE08\uC9C0\uB429\uB2C8\uB2E4."]],
        ["\uC81C6\uC870 (\uCC3D\uC791\uC790\uC758 \uAD8C\uB9AC\uC640 \uC758\uBB34)", ["\uCC3D\uC791\uC790\uB294 \uC790\uC2E0\uC774 \uC5C5\uB85C\uB4DC\uD55C \uADF8\uB798\uD53D\uC758 \uC800\uC791\uAD8C\uC744 \uBCF4\uC720\uD558\uBA70, \uD68C\uC0AC\uC5D0 \uC11C\uBE44\uC2A4 \uC6B4\uC601\uC5D0 \uD544\uC694\uD55C \uBC94\uC704\uC758 \uC774\uC6A9\uC744 \uD5C8\uB77D\uD569\uB2C8\uB2E4.", "\uC5C5\uB85C\uB4DC\uD55C \uADF8\uB798\uD53D\uC740 <b>\uC81C\uCD9C \u2192 \uAC80\uC218 \u2192 \uACF5\uAC1C</b> \uC808\uCC28\uB97C \uAC70\uCE58\uBA70, \uAC80\uC218\uB97C \uD1B5\uACFC\uD55C \uC790\uB8CC\uB9CC \uCE74\uD0C8\uB85C\uADF8\uC5D0 \uACF5\uAC1C\uB429\uB2C8\uB2E4."]],
        ["\uC81C7\uC870 (\uAE08\uC9C0\uD589\uC704)", [["\uD0C0\uC778\uC758 \uC800\uC791\uAD8C\xB7\uC0C1\uD45C\uAD8C \uB4F1 \uAD8C\uB9AC\uB97C \uCE68\uD574\uD558\uB294 \uC790\uB8CC\uC758 \uC5C5\uB85C\uB4DC", "\uD5C8\uC704\xB7\uBD88\uBC95 \uC815\uBCF4\uC758 \uAC8C\uC2DC \uB610\uB294 \uC11C\uBE44\uC2A4 \uC6B4\uC601 \uBC29\uD574 \uD589\uC704", "\uAC80\uC218\uB97C \uC6B0\uD68C\uD558\uAC70\uB098 \uC2DC\uC2A4\uD15C\uC744 \uBD80\uC815\uD558\uAC8C \uC774\uC6A9\uD558\uB294 \uD589\uC704"]]],
        ["\uC81C8\uC870 (\uC720\uB8CC \uC11C\uBE44\uC2A4 \uBC0F \uD658\uBD88)", ["\uC720\uB8CC \uD50C\uB79C\xB7\uCF58\uD150\uCE20\uC758 \uACB0\uC81C \uBC0F \uD658\uBD88\uC740 \uAD00\uB828 \uBC95\uB839\uACFC \uD68C\uC0AC\uC758 \uD658\uBD88 \uC815\uCC45\uC5D0 \uB530\uB985\uB2C8\uB2E4.", "\uD658\uBD88 \uAE30\uC900\xB7\uC808\uCC28\uC758 \uC138\uBD80 \uC0AC\uD56D\uC740 \uBCC4\uB3C4 \uC548\uB0B4\uC5D0 \uB530\uB985\uB2C8\uB2E4."]],
        ["\uC81C9\uC870 (\uCC45\uC784\uC758 \uD55C\uACC4)", ["\uD68C\uC0AC\uB294 \uAC80\uC218 \uC808\uCC28\uB97C \uD1B5\uD574 \uD488\uC9C8 \uD655\uBCF4\uC5D0 \uB178\uB825\uD558\uB098, \uCD09\uAC01 \uADF8\uB798\uD53D\uC758 \uD65C\uC6A9 \uACB0\uACFC\uC5D0 \uB300\uD574\uC11C\uB294 \uBC95\uB839\uC774 \uD5C8\uC6A9\uD558\uB294 \uBC94\uC704\uC5D0\uC11C \uCC45\uC784\uC744 \uC81C\uD55C\uD569\uB2C8\uB2E4.", "\uCC9C\uC7AC\uC9C0\uBCC0, \uC774\uC6A9\uC790 \uADC0\uCC45 \uB4F1 \uD68C\uC0AC\uC758 \uD569\uB9AC\uC801 \uD1B5\uC81C\uB97C \uBC97\uC5B4\uB09C \uC0AC\uC720\uB85C \uC778\uD55C \uC190\uD574\uC5D0 \uB300\uD574\uC11C\uB294 \uCC45\uC784\uC744 \uC9C0\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4."]],
        ["\uC81C10\uC870 (\uC900\uAC70\uBC95 \uBC0F \uBD84\uC7C1 \uD574\uACB0)", ["\uBCF8 \uC57D\uAD00\uC740 \uB300\uD55C\uBBFC\uAD6D \uBC95\uB839\uC5D0 \uB530\uB77C \uD574\uC11D\uB418\uBA70, \uC11C\uBE44\uC2A4 \uC774\uC6A9\uACFC \uAD00\uB828\uD55C \uBD84\uC7C1\uC740 \uAD00\uB828 \uBC95\uB839\uC5D0 \uB530\uB978 \uC808\uCC28\uB85C \uD574\uACB0\uD569\uB2C8\uB2E4."]]
